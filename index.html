<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>KeuanganKu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
html, body { margin: 0; padding: 0; background: #F5F7FB; min-height: 100vh; }
#root { display: flex; justify-content: center; width: 100%; min-height: 100vh; }

.kk-root {
  --kk-primary: #2C5CE0; --kk-primary-dark: #1E3FAE; --kk-primary-light: #E8EEFE;
  --kk-bg: #F5F7FB; --kk-surface: #FFFFFF; --kk-surface-alt: #EEF2FB;
  --kk-text: #16213E; --kk-text-secondary: #6B7594;
  --kk-success: #16A34A; --kk-success-light: #E7F8ED;
  --kk-danger: #E23744; --kk-danger-light: #FCEAEB;
  --kk-warning: #E8912D; --kk-warning-light: #FDF1E1;
  --kk-border: #E7EBF5; --kk-radius: 16px; --kk-shadow: 0 4px 16px rgba(22,33,62,0.06);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex; justify-content: center; width: 100%;
}
.kk-root[data-theme="dark"] {
  --kk-primary: #5B85F5; --kk-primary-dark: #4468D6; --kk-primary-light: #1E2C4C;
  --kk-bg: #0E1526; --kk-surface: #16203A; --kk-surface-alt: #1C2740;
  --kk-text: #EDF1FB; --kk-text-secondary: #93A0C2;
  --kk-success: #34D07E; --kk-success-light: #12301F;
  --kk-danger: #F0555F; --kk-danger-light: #3A1518;
  --kk-warning: #F0A94C; --kk-warning-light: #3A2A12;
  --kk-border: #26314E; --kk-shadow: 0 4px 20px rgba(0,0,0,0.35);
}
.kk-root * { box-sizing: border-box; }
.kk-phone { width: 100%; max-width: 430px; background: var(--kk-bg); color: var(--kk-text); min-height: 100vh; position: relative; display: flex; flex-direction: column; }
@media (min-width: 480px) {
  .kk-phone { min-height: 92vh; margin: 4vh 0; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px rgba(22,33,62,0.18); }
}
.kk-splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 500px; gap: 8px; color: var(--kk-text); }
.kk-splash-badge { width: 56px; height: 56px; border-radius: 18px; background: var(--kk-primary); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; font-size: 24px; }
.kk-splash-title { font-size: 17px; font-weight: 700; margin: 0; }
.kk-splash-sub { font-size: 13px; color: var(--kk-text-secondary); margin: 0; }

.kk-screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.kk-page { padding: 18px 16px 8px; }
.kk-page-body { padding: 14px 16px 8px; }
.kk-page-title { font-size: 20px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.2px; }

.kk-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; border-bottom: 1px solid var(--kk-border); position: sticky; top: 0; background: var(--kk-surface); z-index: 5; }
.kk-topbar-title { font-size: 16px; font-weight: 700; margin: 0; }
.kk-icon-btn { width: 36px; height: 36px; border-radius: 12px; border: none; background: var(--kk-surface-alt); color: var(--kk-text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.kk-icon-btn:active { transform: scale(0.94); }
.kk-icon-btn.xs { width: 30px; height: 30px; border-radius: 9px; }
.kk-icon-btn.danger { color: var(--kk-danger); background: var(--kk-danger-light); }

.kk-dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.kk-greeting { font-size: 13px; color: var(--kk-text-secondary); margin: 0; }
.kk-greeting-name { font-size: 19px; font-weight: 700; margin: 2px 0 0; }
.kk-avatar-sm { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }

.kk-balance-card { background: linear-gradient(135deg, var(--kk-primary) 0%, var(--kk-primary-dark) 100%); border-radius: var(--kk-radius); padding: 20px; color: #fff; position: relative; overflow: hidden; margin-bottom: 14px; }
.kk-balance-sparkline { position: absolute; bottom: 0; left: 0; right: 0; opacity: 0.9; }
.kk-balance-label { font-size: 12.5px; opacity: 0.85; margin: 0 0 6px; position: relative; }
.kk-balance-value { font-size: 27px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.3px; position: relative; font-variant-numeric: tabular-nums; }
.kk-balance-value.dark { color: var(--kk-text); font-size: 24px; }
.kk-wallets-link { background: rgba(255,255,255,0.16); border: none; border-radius: 100px; color: #fff; font-size: 12px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; position: relative; }

.kk-kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.kk-kpi-card { background: var(--kk-surface); border-radius: 14px; padding: 14px; box-shadow: var(--kk-shadow); }
.kk-kpi-card.income { border-left: 3px solid var(--kk-success); }
.kk-kpi-card.expense { border-left: 3px solid var(--kk-danger); }
.kk-kpi-icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.kk-kpi-card.income .kk-kpi-icon { background: var(--kk-success-light); color: var(--kk-success); }
.kk-kpi-card.expense .kk-kpi-icon { background: var(--kk-danger-light); color: var(--kk-danger); }
.kk-kpi-label { font-size: 12px; color: var(--kk-text-secondary); margin: 0 0 4px; }
.kk-kpi-value { font-size: 16px; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
.kk-kpi-value.neg { color: var(--kk-danger); }

.kk-alert-banner { display: flex; align-items: center; gap: 8px; background: var(--kk-warning-light); color: var(--kk-warning); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; cursor: pointer; }

.kk-card { background: var(--kk-surface); border-radius: var(--kk-radius); padding: 16px; box-shadow: var(--kk-shadow); margin-bottom: 12px; }
.kk-card.no-pad { padding: 4px; }
.kk-card-title { font-size: 14.5px; font-weight: 700; margin: 0 0 4px; }
.kk-card-sub { font-size: 12px; color: var(--kk-text-secondary); margin: 0 0 8px; }
.kk-card-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.kk-link-btn { background: none; border: none; color: var(--kk-primary); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px; }

.kk-legend-row { display: flex; gap: 14px; justify-content: center; margin-top: 6px; }
.kk-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--kk-text-secondary); }
.kk-legend-item i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.kk-cat-list { margin-top: 8px; display: flex; flex-direction: column; gap: 9px; }
.kk-cat-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.kk-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.kk-cat-name { flex: 1; color: var(--kk-text); }
.kk-cat-val { font-weight: 600; font-variant-numeric: tabular-nums; }
.kk-rank { width: 20px; height: 20px; border-radius: 50%; background: var(--kk-primary-light); color: var(--kk-primary-dark); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.kk-tx-list { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.kk-tx-row { display: flex; align-items: center; gap: 10px; background: none; border: none; width: 100%; padding: 8px 4px; cursor: pointer; text-align: left; border-radius: 10px; }
.kk-tx-row:active, .kk-tx-row-clickable:active { background: var(--kk-surface-alt); }
.kk-tx-icon { width: 36px; height: 36px; border-radius: 11px; background: var(--kk-surface-alt); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.kk-tx-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kk-tx-desc { font-size: 13.5px; font-weight: 600; color: var(--kk-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kk-tx-date { font-size: 11.5px; color: var(--kk-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kk-tx-amt { font-size: 13.5px; font-weight: 700; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.kk-tx-amt.pos { color: var(--kk-success); }
.kk-tx-amt.neg { color: var(--kk-danger); }

.kk-tx-group { margin-bottom: 12px; }
.kk-tx-group-date { font-size: 12px; font-weight: 600; color: var(--kk-text-secondary); margin: 0 0 6px 4px; }
.kk-tx-row-full { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; }
.kk-tx-row-clickable { display: flex; align-items: center; gap: 10px; background: none; border: none; flex: 1; min-width: 0; padding: 6px; cursor: pointer; text-align: left; border-radius: 10px; }
.kk-tx-actions { display: flex; gap: 4px; flex-shrink: 0; }

.kk-search-row { display: flex; gap: 8px; margin-bottom: 10px; }
.kk-search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--kk-surface); border: 1px solid var(--kk-border); border-radius: 12px; padding: 0 12px; height: 42px; color: var(--kk-text-secondary); }
.kk-search-box input { flex: 1; border: none; outline: none; background: none; font-size: 13.5px; color: var(--kk-text); height: 100%; }
.kk-search-box button { background: none; border: none; color: var(--kk-text-secondary); cursor: pointer; display: flex; }
.kk-filter-btn { position: relative; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--kk-border); background: var(--kk-surface); color: var(--kk-text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.kk-filter-btn.active { border-color: var(--kk-primary); color: var(--kk-primary); }
.kk-filter-badge { position: absolute; top: -4px; right: -4px; background: var(--kk-primary); color: #fff; font-size: 9px; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

.kk-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.kk-chip { background: var(--kk-surface); border: 1px solid var(--kk-border); border-radius: 100px; padding: 7px 13px; font-size: 12.5px; color: var(--kk-text-secondary); cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.kk-chip.active { background: var(--kk-primary); border-color: var(--kk-primary); color: #fff; }
.kk-chip.sort { margin-left: auto; }

.kk-fab { position: absolute; right: 16px; bottom: 82px; width: 54px; height: 54px; border-radius: 50%; background: var(--kk-primary); color: #fff; border: none; box-shadow: 0 6px 16px rgba(44,92,224,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; }
.kk-fab:active { transform: scale(0.94); }

.kk-bottomnav { position: sticky; bottom: 0; display: flex; background: var(--kk-surface); border-top: 1px solid var(--kk-border); padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 15; }
.kk-navitem { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--kk-text-secondary); font-size: 10.5px; padding: 4px; cursor: pointer; }
.kk-navitem.active { color: var(--kk-primary); font-weight: 600; }

.kk-overlay { position: fixed; inset: 0; background: rgba(10,15,30,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.kk-fullsheet { background: var(--kk-bg); width: 100%; max-width: 430px; height: 100%; max-height: 100%; display: flex; flex-direction: column; }
.kk-form-scroll { flex: 1; overflow-y: auto; padding: 16px; }
.kk-form-footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--kk-border); background: var(--kk-surface); }

.kk-sheet { background: var(--kk-surface); width: 100%; max-width: 430px; border-radius: 20px 20px 0 0; padding: 10px 18px 22px; max-height: 85vh; overflow-y: auto; }
.kk-sheet-handle { width: 36px; height: 4px; background: var(--kk-border); border-radius: 4px; margin: 4px auto 14px; }
.kk-sheet-title { font-size: 16px; font-weight: 700; margin: 0 0 14px; }
.kk-sheet-actions { display: flex; gap: 10px; margin-top: 18px; }

.kk-field-label { font-size: 12.5px; font-weight: 600; color: var(--kk-text-secondary); margin: 14px 0 6px; }
.kk-field-label:first-child { margin-top: 0; }
.kk-input, .kk-select, .kk-textarea { width: 100%; border: 1px solid var(--kk-border); background: var(--kk-surface); color: var(--kk-text); border-radius: 12px; padding: 11px 13px; font-size: 13.5px; outline: none; font-family: inherit; }
.kk-input.err, .kk-select.err { border-color: var(--kk-danger); }
.kk-textarea { resize: vertical; }
.kk-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kk-error { color: var(--kk-danger); font-size: 11.5px; margin: 5px 0 0; }

.kk-segmented { display: flex; background: var(--kk-surface-alt); border-radius: 12px; padding: 4px; gap: 4px; }
.kk-seg-btn { flex: 1; border: none; background: none; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--kk-text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.kk-seg-btn.active.income { background: var(--kk-success); color: #fff; }
.kk-seg-btn.active.expense { background: var(--kk-danger); color: #fff; }
.kk-seg-btn.active:not(.income):not(.expense) { background: var(--kk-primary); color: #fff; }

.kk-amount-input { display: flex; align-items: center; gap: 6px; border: 1px solid var(--kk-border); border-radius: 12px; padding: 11px 13px; background: var(--kk-surface); }
.kk-amount-input.err { border-color: var(--kk-danger); }
.kk-amount-input span { font-size: 14px; font-weight: 700; color: var(--kk-text-secondary); }
.kk-amount-input input { flex: 1; border: none; outline: none; background: none; font-size: 17px; font-weight: 700; color: var(--kk-text); font-variant-numeric: tabular-nums; }

.kk-cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kk-cat-chip { display: flex; flex-direction: column; align-items: center; gap: 5px; background: var(--kk-surface-alt); border: 1.5px solid transparent; border-radius: 12px; padding: 10px 4px; cursor: pointer; font-size: 11px; color: var(--kk-text); text-align: center; }
.kk-cat-chip.active { border-color: var(--kk-primary); background: var(--kk-primary-light); color: var(--kk-primary-dark); font-weight: 600; }
.kk-cat-chip-icon { font-size: 19px; }

.kk-upload-box { width: 100%; border: 1.5px dashed var(--kk-border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--kk-surface-alt); color: var(--kk-text-secondary); cursor: pointer; font-size: 12.5px; }
.kk-receipt-preview { position: relative; width: 100px; height: 100px; border-radius: 12px; overflow: hidden; }
.kk-receipt-preview img { width: 100%; height: 100%; object-fit: cover; }
.kk-receipt-remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.kk-btn { border: none; border-radius: 12px; padding: 12px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.kk-btn.primary { background: var(--kk-primary); color: #fff; }
.kk-btn.danger { background: var(--kk-danger); color: #fff; }
.kk-btn.ghost { background: var(--kk-surface-alt); color: var(--kk-text); }
.kk-btn.secondary { background: var(--kk-surface); color: var(--kk-primary); border: 1px solid var(--kk-primary); }
.kk-btn.full { width: 100%; margin-top: 4px; }
.kk-btn:active { transform: scale(0.98); }
.kk-btn:disabled { opacity: 0.55; cursor: not-allowed; }

.kk-toggle { width: 42px; height: 24px; border-radius: 100px; background: var(--kk-border); border: none; position: relative; cursor: pointer; flex-shrink: 0; }
.kk-toggle.on { background: var(--kk-primary); }
.kk-toggle-knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.15s; }
.kk-toggle.on .kk-toggle-knob { left: 20px; }

.kk-progress-track { width: 100%; height: 8px; background: var(--kk-surface-alt); border-radius: 100px; overflow: hidden; }
.kk-progress-fill { height: 100%; border-radius: 100px; transition: width 0.2s; }
.kk-progress-fill.tone-primary { background: var(--kk-primary); }
.kk-progress-fill.tone-warning { background: var(--kk-warning); }
.kk-progress-fill.tone-danger { background: var(--kk-danger); }

.kk-budget-pct { font-size: 12px; font-weight: 700; }
.kk-budget-pct.tone-primary { color: var(--kk-primary); }
.kk-budget-pct.tone-warning { color: var(--kk-warning); }
.kk-budget-pct.tone-danger { color: var(--kk-danger); }
.kk-status-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 100px; }
.kk-status-pill.tone-warning { background: var(--kk-warning-light); color: var(--kk-warning); }
.kk-status-pill.tone-danger { background: var(--kk-danger-light); color: var(--kk-danger); }

.kk-wallet-card { display: flex; align-items: center; gap: 12px; background: var(--kk-surface); border-radius: 14px; padding: 14px; box-shadow: var(--kk-shadow); margin-bottom: 10px; }
.kk-wallet-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--kk-surface-alt); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
.kk-wallet-info { flex: 1; min-width: 0; }
.kk-wallet-name { font-size: 13.5px; font-weight: 700; margin: 0; }
.kk-wallet-type { font-size: 11.5px; color: var(--kk-text-secondary); margin: 2px 0 0; }
.kk-wallet-right { text-align: right; flex-shrink: 0; }
.kk-wallet-balance { font-size: 13.5px; font-weight: 700; margin: 0 0 4px; font-variant-numeric: tabular-nums; }
.kk-wallet-balance.neg { color: var(--kk-danger); }

.kk-icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.kk-icon-choice { width: 100%; aspect-ratio: 1; border-radius: 10px; background: var(--kk-surface-alt); border: 1.5px solid transparent; font-size: 17px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.kk-icon-choice.active { border-color: var(--kk-primary); background: var(--kk-primary-light); }
.kk-color-choice { width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; }

.kk-export-opt { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--kk-surface-alt); border: none; border-radius: 12px; padding: 13px; font-size: 13.5px; color: var(--kk-text); margin-bottom: 8px; cursor: pointer; }
.kk-export-opt span { flex: 1; text-align: left; font-weight: 600; }

.kk-profile-header { display: flex; align-items: center; gap: 12px; background: var(--kk-surface); border-radius: var(--kk-radius); padding: 16px; box-shadow: var(--kk-shadow); margin-bottom: 16px; }
.kk-avatar-lg { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.kk-logout-btn { display: flex; align-items: center; gap: 5px; background: var(--kk-danger-light); color: var(--kk-danger); border: none; border-radius: 100px; padding: 8px 13px; font-size: 12px; font-weight: 700; cursor: pointer; }

.kk-section-label { font-size: 12px; font-weight: 700; color: var(--kk-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; margin: 4px 0 8px 4px; }
.kk-menu-row { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 13px 10px; font-size: 13.5px; color: var(--kk-text); cursor: pointer; border-bottom: 1px solid var(--kk-border); text-align: left; }
.kk-menu-row:last-child { border-bottom: none; }
.kk-menu-row.danger { color: var(--kk-danger); }
.kk-menu-row span:nth-child(2) { flex: 1; }
.kk-menu-icon { width: 20px; display: flex; align-items: center; justify-content: center; }
.kk-menu-row-label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.kk-setting-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 10px; font-size: 13.5px; border-bottom: 1px solid var(--kk-border); }
.kk-setting-row:last-child { border-bottom: none; }
.kk-theme-switch { display: flex; align-items: center; gap: 5px; background: var(--kk-surface-alt); border: none; border-radius: 100px; padding: 6px 12px; font-size: 12px; color: var(--kk-text); cursor: pointer; }
.kk-app-version { text-align: center; font-size: 11px; color: var(--kk-text-secondary); margin: 18px 0 6px; }

.kk-info-note { font-size: 12px; color: var(--kk-text-secondary); background: var(--kk-surface-alt); padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
.kk-notif-row { display: flex; gap: 10px; align-items: flex-start; padding: 12px 10px; border-bottom: 1px solid var(--kk-border); }
.kk-notif-row:last-child { border-bottom: none; }
.kk-notif-icon { font-size: 17px; flex-shrink: 0; }
.kk-notif-text { font-size: 12.5px; color: var(--kk-text); line-height: 1.5; }

.kk-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 16px; text-align: center; }
.kk-empty-icon { font-size: 32px; margin-bottom: 8px; }
.kk-empty-title { font-size: 13.5px; font-weight: 700; margin: 0 0 4px; }
.kk-empty-sub { font-size: 12px; color: var(--kk-text-secondary); margin: 0; max-width: 240px; }

.kk-confirm-card { background: var(--kk-surface); border-radius: 18px; padding: 22px; width: 88%; max-width: 320px; margin: auto; text-align: center; }
.kk-confirm-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
.kk-confirm-icon.danger { background: var(--kk-danger-light); color: var(--kk-danger); }
.kk-confirm-icon.primary { background: var(--kk-primary-light); color: var(--kk-primary); }
.kk-confirm-title { font-size: 14.5px; font-weight: 700; margin: 0 0 6px; }
.kk-confirm-msg { font-size: 12.5px; color: var(--kk-text-secondary); margin: 0 0 18px; line-height: 1.5; }
.kk-confirm-actions { display: flex; gap: 10px; }
.kk-confirm-actions .kk-btn { flex: 1; }

.kk-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--kk-text); color: var(--kk-bg); padding: 10px 16px; border-radius: 100px; font-size: 12.5px; display: flex; align-items: center; gap: 7px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); z-index: 60; white-space: nowrap; }
.kk-toast.tone-danger { background: var(--kk-danger); color: #fff; }

.kk-setup-progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
.kk-setup-dot { width: 26px; height: 5px; border-radius: 4px; background: var(--kk-border); }
.kk-setup-dot.active { background: var(--kk-primary); }

.kk-login-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kk-login-tile { position: relative; background: var(--kk-surface); border: 1px solid var(--kk-border); border-radius: 16px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; box-shadow: var(--kk-shadow); }
.kk-login-tile.recent { border-color: var(--kk-primary); }
.kk-login-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
.kk-login-avatar.sm { width: 34px; height: 34px; font-size: 17px; }
.kk-login-name { font-size: 13px; font-weight: 700; color: var(--kk-text); text-align: center; }
.kk-login-recent-badge { position: absolute; top: 8px; right: 8px; background: var(--kk-primary-light); color: var(--kk-primary-dark); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 100px; }

.kk-pinpad-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 14px; }
.kk-pinpad-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; text-align: center; }
.kk-pinpad-sub { font-size: 12.5px; color: var(--kk-text-secondary); margin: 0 0 20px; text-align: center; }
.kk-pin-dots { display: flex; gap: 14px; margin-bottom: 8px; }
.kk-pin-dots.shake { animation: kk-shake 0.4s; }
@keyframes kk-shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.kk-pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--kk-border); background: transparent; }
.kk-pin-dot.filled { background: var(--kk-primary); border-color: var(--kk-primary); }
.kk-pinpad-grid { display: grid; grid-template-columns: repeat(3, 64px); gap: 14px; margin-top: 26px; }
.kk-pinpad-key { width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--kk-surface-alt); color: var(--kk-text); font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.kk-pinpad-key:active { background: var(--kk-primary-light); }

.kk-config-warn { position: fixed; top: 0; left: 0; right: 0; background: #E23744; color: #fff; font-size: 12px; text-align: center; padding: 8px 12px; z-index: 100; }

@media print { .kk-bottomnav, .kk-fab, .kk-topbar button { display: none !important; } }
</style>
