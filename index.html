<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KeuanganKu</title>
<style>
:root{
  --kk-primary:#5B85F5; --kk-primary-dark:#4468D6; --kk-primary-light:#1E2C4C;
  --kk-bg:#0E1526; --kk-surface:#16203A; --kk-surface-alt:#1C2740;
  --kk-text:#EDF1FB; --kk-text-secondary:#93A0C2;
  --kk-success:#34D07E; --kk-success-light:#12301F;
  --kk-danger:#F0555F; --kk-danger-light:#3A1518;
  --kk-warning:#F0A94C; --kk-warning-light:#3A2A12;
  --kk-transfer:#5B85F5;
  --kk-border:#26314E; --kk-radius:16px; --kk-shadow:0 4px 20px rgba(0,0,0,.35);
}
:root:not([data-theme="dark2"]){}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--kk-bg);min-height:100%;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{color:var(--kk-text);}
#root{display:flex;justify-content:center;width:100%;min-height:100%;}
.kk-phone{width:100%;max-width:460px;background:var(--kk-bg);color:var(--kk-text);min-height:100vh;position:relative;display:flex;flex-direction:column;}
img,svg{max-width:100%;}
button{font-family:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.kk-screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:96px;}
.kk-page{padding:16px 16px 4px;}
.kk-page-title{font-size:20px;font-weight:700;margin:0 0 14px;letter-spacing:-.2px;}

.kk-topbar{display:flex;align-items:center;gap:10px;padding:14px 12px;border-bottom:1px solid var(--kk-border);position:sticky;top:0;background:var(--kk-bg);z-index:5;}
.kk-topbar-title{font-size:16px;font-weight:700;margin:0;flex:1;}
.kk-icon-btn{width:36px;height:36px;border-radius:12px;border:none;background:var(--kk-surface-alt);color:var(--kk-text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;}
.kk-icon-btn:active{transform:scale(.94);}
.kk-icon-btn.danger{color:var(--kk-danger);background:var(--kk-danger-light);}
.kk-icon-btn.primary{color:#fff;background:var(--kk-primary);}

.kk-dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.kk-greeting{font-size:13px;color:var(--kk-text-secondary);margin:0;}
.kk-greeting-name{font-size:19px;font-weight:700;margin:2px 0 0;}
.kk-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--kk-primary-light);border:none;cursor:pointer;color:var(--kk-text);}

.kk-balance-card{background:linear-gradient(135deg,var(--kk-primary) 0%,var(--kk-primary-dark) 100%);border-radius:var(--kk-radius);padding:20px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px;}
.kk-balance-label{font-size:12.5px;opacity:.85;margin:0 0 6px;}
.kk-balance-value{font-size:26px;font-weight:700;margin:0 0 12px;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
.kk-balance-split{display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px;margin-top:2px;}
.kk-balance-split div{flex:1;}
.kk-balance-split .lbl{font-size:11px;opacity:.8;margin:0 0 2px;}
.kk-balance-split .val{font-size:14px;font-weight:700;margin:0;font-variant-numeric:tabular-nums;}

.kk-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.kk-kpi-card{background:var(--kk-surface);border-radius:14px;padding:14px;box-shadow:var(--kk-shadow);}
.kk-kpi-card.income{border-left:3px solid var(--kk-success);}
.kk-kpi-card.expense{border-left:3px solid var(--kk-danger);}
.kk-kpi-label{font-size:12px;color:var(--kk-text-secondary);margin:0 0 4px;}
.kk-kpi-value{font-size:16px;font-weight:700;margin:0;font-variant-numeric:tabular-nums;}

.kk-card{background:var(--kk-surface);border-radius:var(--kk-radius);padding:16px;box-shadow:var(--kk-shadow);margin-bottom:12px;}
.kk-card.no-pad{padding:4px;}
.kk-card-title{font-size:14.5px;font-weight:700;margin:0 0 4px;}
.kk-card-sub{font-size:12px;color:var(--kk-text-secondary);margin:0 0 8px;}
.kk-card-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.kk-link-btn{background:none;border:none;color:var(--kk-primary);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px;}

.kk-tx-row{display:flex;align-items:center;gap:10px;background:none;border:none;width:100%;padding:9px 4px;cursor:pointer;text-align:left;border-radius:10px;}
.kk-tx-row:active{background:var(--kk-surface-alt);}
.kk-tx-icon{width:38px;height:38px;border-radius:12px;background:var(--kk-surface-alt);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.kk-tx-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.kk-tx-desc{font-size:13.5px;font-weight:600;color:var(--kk-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kk-tx-date{font-size:11.5px;color:var(--kk-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kk-tx-amt{font-size:13.5px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
.kk-tx-amt.pos{color:var(--kk-success);}
.kk-tx-amt.neg{color:var(--kk-danger);}
.kk-tx-amt.neu{color:var(--kk-text-secondary);}
.kk-tx-group-date{font-size:12px;font-weight:600;color:var(--kk-text-secondary);margin:14px 0 4px 4px;}
.kk-empty{text-align:center;padding:40px 12px;color:var(--kk-text-secondary);font-size:13px;}

.kk-search-row{display:flex;gap:8px;margin-bottom:10px;}
.kk-search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--kk-surface);border:1px solid var(--kk-border);border-radius:12px;padding:0 12px;height:40px;color:var(--kk-text-secondary);}
.kk-search-box input{flex:1;border:none;outline:none;background:none;font-size:13.5px;color:var(--kk-text);height:100%;}
.kk-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.kk-chip{background:var(--kk-surface);border:1px solid var(--kk-border);border-radius:100px;padding:7px 13px;font-size:12.5px;color:var(--kk-text-secondary);cursor:pointer;white-space:nowrap;}
.kk-chip.active{background:var(--kk-primary);border-color:var(--kk-primary);color:#fff;}

.kk-cat-list{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
.kk-cat-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.kk-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.kk-cat-name{flex:1;color:var(--kk-text);}
.kk-cat-val{font-weight:600;font-variant-numeric:tabular-nums;}

.kk-bank-card{background:var(--kk-surface);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--kk-shadow);cursor:pointer;}
.kk-bank-icon{width:42px;height:42px;border-radius:12px;background:var(--kk-primary-light);color:var(--kk-primary);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
.kk-bank-mid{flex:1;min-width:0;}
.kk-bank-name{font-size:14px;font-weight:700;margin:0;}
.kk-bank-owner{font-size:11.5px;color:var(--kk-text-secondary);margin:2px 0 0;}
.kk-bank-val{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;}

.kk-bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--kk-surface);border-top:1px solid var(--kk-border);display:flex;align-items:center;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;}
.kk-nav-btn{background:none;border:none;color:var(--kk-text-secondary);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;cursor:pointer;padding:4px 6px;flex:1;}
.kk-nav-btn .ic{font-size:19px;}
.kk-nav-btn.active{color:var(--kk-primary);}
.kk-fab{width:52px;height:52px;border-radius:50%;background:var(--kk-primary);color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(91,133,245,.5);margin-top:-30px;flex-shrink:0;}
.kk-fab:active{transform:scale(.94);}

.kk-sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
.kk-sheet{width:100%;max-width:460px;background:var(--kk-surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:kk-up .18s ease-out;}
@keyframes kk-up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.kk-sheet-handle{width:38px;height:4px;background:var(--kk-border);border-radius:4px;margin:6px auto 14px;}
.kk-sheet-title{font-size:16px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;}

.kk-field{margin-bottom:14px;}
.kk-field label{display:block;font-size:12.5px;color:var(--kk-text-secondary);margin-bottom:6px;font-weight:600;}
.kk-input,.kk-select,.kk-textarea{width:100%;background:var(--kk-surface-alt);border:1px solid var(--kk-border);border-radius:12px;padding:12px 13px;color:var(--kk-text);font-size:14.5px;outline:none;}
.kk-input:focus,.kk-select:focus,.kk-textarea:focus{border-color:var(--kk-primary);}
.kk-amount-input{font-size:22px;font-weight:700;}
.kk-radio-row{display:flex;gap:8px;flex-wrap:wrap;}
.kk-radio-chip{flex:1;min-width:78px;text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--kk-border);background:var(--kk-surface-alt);font-size:12.5px;color:var(--kk-text-secondary);cursor:pointer;}
.kk-radio-chip.active{border-color:var(--kk-primary);color:var(--kk-primary);background:var(--kk-primary-light);font-weight:700;}
.kk-btn{width:100%;padding:14px;border-radius:14px;border:none;background:var(--kk-primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.kk-btn:active{transform:scale(.98);}
.kk-btn.secondary{background:var(--kk-surface-alt);color:var(--kk-text);}
.kk-btn.danger{background:var(--kk-danger);}
.kk-btn[disabled]{opacity:.5;cursor:not-allowed;}
.kk-err{color:var(--kk-danger);font-size:12.5px;margin:-6px 0 12px;}
.kk-toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--kk-surface-alt);border:1px solid var(--kk-border);color:var(--kk-text);padding:11px 18px;border-radius:100px;font-size:13px;z-index:100;box-shadow:var(--kk-shadow);max-width:88%;text-align:center;}

.kk-quick-actions{display:flex;flex-direction:column;gap:10px;}
.kk-quick-btn{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--kk-surface-alt);border:none;color:var(--kk-text);font-size:14.5px;font-weight:600;cursor:pointer;text-align:left;}
.kk-quick-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

.kk-segment{display:flex;background:var(--kk-surface-alt);border-radius:12px;padding:4px;margin-bottom:16px;}
.kk-segment button{flex:1;border:none;background:none;padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--kk-text-secondary);cursor:pointer;}
.kk-segment button.active{background:var(--kk-primary);color:#fff;}

.kk-detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--kk-border);font-size:13px;}
.kk-detail-row:last-child{border-bottom:none;}
.kk-detail-row .k{color:var(--kk-text-secondary);}
.kk-detail-row .v{font-weight:600;text-align:right;}

.kk-menu-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:13px 12px;color:var(--kk-text);font-size:13.5px;cursor:pointer;text-align:left;border-bottom:1px solid var(--kk-border);}
.kk-menu-row:last-child{border-bottom:none;}
.kk-menu-row.danger{color:var(--kk-danger);}
.kk-menu-icon{font-size:17px;width:22px;text-align:center;}
.kk-menu-row span:nth-child(2){flex:1;}
.kk-chev{color:var(--kk-text-secondary);}
.kk-section-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--kk-text-secondary);margin:18px 4px 8px;}
.kk-profile-pick{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--kk-surface-alt);margin-bottom:8px;cursor:pointer;border:2px solid transparent;}
.kk-profile-pick.active{border-color:var(--kk-primary);}
.kk-bar{height:8px;border-radius:6px;background:var(--kk-border);overflow:hidden;display:flex;}
.kk-test-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--kk-border);font-size:12.5px;}
.kk-test-row:last-child{border-bottom:none;}
.kk-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;}
.kk-badge.ok{background:var(--kk-success-light);color:var(--kk-success);}
.kk-badge.fail{background:var(--kk-danger-light);color:var(--kk-danger);}
canvas{max-width:100%;}
.kk-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:10px;color:var(--kk-text-secondary);font-size:13px;}
.kk-splash-badge{width:56px;height:56px;border-radius:18px;background:var(--kk-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
(function(){
"use strict";

/* ============================================================
   CONSTANTS
============================================================ */
var CATEGORIES_INCOME = ["Gaji","Bonus","Bisnis","Transfer Masuk","Lainnya"];
var CATEGORIES_EXPENSE = ["Makanan","Transportasi","Tagihan","Belanja","Pendidikan","Rumah Tangga","Kesehatan","Lainnya"];
var CAT_ICON = {
  "Gaji":"💼","Bonus":"🎁","Bisnis":"📈","Transfer Masuk":"↙","Lainnya":"🧾",
  "Makanan":"🍔","Transportasi":"🚌","Tagihan":"🧾","Belanja":"🛍️","Pendidikan":"🎓",
  "Rumah Tangga":"🏠","Kesehatan":"💊"
};
var MONTHS_ID = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
var MONTHS_FULL_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var DAYS_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

var DEFAULT_ACCOUNTS = [
  {id:"DIMAS", name:"Dimas Setiyanto", avatar:"👨‍💼"},
  {id:"NURSANTI", name:"Nur Santi", avatar:"👩‍💼"}
];
var DEFAULT_BANK_ACCOUNTS = [
  {id:"DIMAS_BCA", account_id:"DIMAS", bank_name:"BCA", balance:3000000},
  {id:"DIMAS_MANDIRI", account_id:"DIMAS", bank_name:"Mandiri", balance:2000000},
  {id:"NURSANTI_BCA", account_id:"NURSANTI", bank_name:"BCA", balance:1500000},
  {id:"NURSANTI_MANDIRI", account_id:"NURSANTI", bank_name:"Mandiri", balance:1018000}
];

/* ============================================================
   UTIL
============================================================ */
function fmtRp(n){
  n = Math.round(n||0);
  var neg = n<0; n = Math.abs(n);
  var s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return (neg?"-":"")+"Rp "+s;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDateShort(iso){
  var d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return iso;
  return d.getDate()+" "+MONTHS_ID[d.getMonth()]+" "+d.getFullYear();
}
function fmtDateGroup(iso){
  var d = new Date(iso+"T00:00:00");
  var t = new Date(); t.setHours(0,0,0,0);
  var y = new Date(t); y.setDate(y.getDate()-1);
  if(iso===todayISO()) return "Hari ini";
  if(d.getTime()===y.getTime()) return "Kemarin";
  return DAYS_ID[d.getDay()]+", "+d.getDate()+" "+MONTHS_ID[d.getMonth()]+" "+d.getFullYear();
}
function uid(prefix){ return (prefix||"ID")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function monthKey(iso){ return iso.slice(0,7); }
function greetingWord(){
  var h = new Date().getHours();
  if(h<10) return "Selamat pagi,";
  if(h<15) return "Selamat siang,";
  if(h<18) return "Selamat sore,";
  return "Selamat malam,";
}
function toast(msg){
  S.toastMsg = msg;
  render();
  clearTimeout(S._toastTimer);
  S._toastTimer = setTimeout(function(){ S.toastMsg=null; render(); }, 2400);
}

/* ============================================================
   PURE FINANCE LOGIC (shared by app + self-tests)
============================================================ */
function applyIncome(bank, nominal){
  var before = bank.balance;
  var after = before + nominal;
  return {before:before, after:after};
}
function applyExpense(bank, nominal){
  var before = bank.balance;
  if(nominal > before) return {error:"Saldo tidak mencukupi."};
  var after = before - nominal;
  return {before:before, after:after};
}
function validateTransfer(opts){
  // opts: {nominal, fromBank, toBank, fromAccountId, toAccountId, isSelfTransfer}
  if(!(opts.nominal > 0)) return "Nominal transfer tidak valid.";
  if(!opts.fromBank) return "Rekening sumber tidak ditemukan.";
  if(!opts.toBank) return "Rekening tujuan tidak ditemukan.";
  if(!opts.isSelfTransfer && opts.fromAccountId === opts.toAccountId) return "Akun sumber sama dengan akun tujuan.";
  if(opts.isSelfTransfer && opts.fromBank.id === opts.toBank.id) return "Rekening sumber sama dengan rekening tujuan.";
  if(opts.nominal > opts.fromBank.balance) return "Saldo tidak mencukupi.";
  return null;
}

/* ============================================================
   STATE
============================================================ */
var S = {
  ready:false,
  dbOn:false,
  downloadsOn:false,
  currentUser: (localStorage.getItem("kk_current_user")||"DIMAS"),
  theme: "dark",
  page: "home", // home | rekening | statistik | transfer | profil | riwayat | kasKeluarga | kategori | notifikasi
  modal: null,  // {type:'addSheet'|'income'|'expense'|'detail'|'profilePicker'|'bankForm', ...}
  accounts: DEFAULT_ACCOUNTS.slice(),
  bankAccounts: [],
  transactions: [],
  toastMsg: null,
  hist: { filterType:"Semua", filterDate:"Bulan ini", filterBank:"Semua", search:"" },
  formErr: null,
  saving: false,
  _toastTimer: null
};

var db = null, downloads = null;

/* ============================================================
   DB BOOTSTRAP
============================================================ */
async function initClaude(){
  try{
    db = await Promise.race([window.claude && window.claude.use("db"), new Promise(function(r){setTimeout(function(){r(null);},10500);})]);
  }catch(e){ db = null; }
  try{
    downloads = await Promise.race([window.claude && window.claude.use("downloads"), new Promise(function(r){setTimeout(function(){r(null);},10500);})]);
  }catch(e){ downloads = null; }
  S.dbOn = !!db;
  S.downloadsOn = !!downloads;

  if(db){
    await seedIfNeeded();
    subscribeAll();
  } else {
    // fallback: local only, no persistence across sessions
    S.accounts = DEFAULT_ACCOUNTS.slice();
    S.bankAccounts = DEFAULT_BANK_ACCOUNTS.map(function(b){ return Object.assign({},b); });
    S.transactions = [];
    S.ready = true;
    render();
  }
}

async function seedIfNeeded(){
  try{
    var seedDoc = db.doc("meta/seed");
    var snap = await seedDoc.get();
    if(snap.exists) return;
    var lock = await db.doc("meta/seed_lock").acquire({holder:"seed-"+Math.random().toString(36).slice(2), ttlMs:8000});
    if(!lock.acquired){
      await new Promise(function(r){setTimeout(r,1200);});
      var s2 = await seedDoc.get();
      if(s2.exists) return;
    }
    var s3 = await seedDoc.get();
    if(s3.exists) return;
    for(var i=0;i<DEFAULT_ACCOUNTS.length;i++){
      var a = DEFAULT_ACCOUNTS[i];
      await db.doc("accounts/"+a.id).set(a);
    }
    for(var j=0;j<DEFAULT_BANK_ACCOUNTS.length;j++){
      var b = DEFAULT_BANK_ACCOUNTS[j];
      await db.doc("bank_accounts/"+b.id).set(b);
    }
    await seedDoc.set({seeded:true, at:new Date().toISOString()});
  }catch(e){ /* best effort seeding */ }
}

function subscribeAll(){
  db.collection("accounts").onSnapshot(function(qs){
    var list = qs.docs.map(function(d){ return d.data(); });
    if(list.length) S.accounts = list.sort(function(a,b){ return a.id<b.id?-1:1; });
    S.ready = true;
    render();
  }, function(){});

  db.collection("bank_accounts").onSnapshot(function(qs){
    S.bankAccounts = qs.docs.map(function(d){ return d.data(); });
    render();
  }, function(){});

  db.collection("transactions").orderBy("tanggal","desc").limit(1000).onSnapshot(function(qs){
    S.transactions = qs.docs.map(function(d){ return d.data(); }).sort(function(a,b){
      if(a.tanggal!==b.tanggal) return a.tanggal<b.tanggal?1:-1;
      return (b.created_at||"").localeCompare(a.created_at||"");
    });
    render();
  }, function(){});
}

/* ============================================================

============================================================ */
function getAccount(id){ return S.accounts.find(function(a){return a.id===id;}); }
function getBank(id){ return S.bankAccounts.find(function(b){return b.id===id;}); }
function banksOf(accountId){ return S.bankAccounts.filter(function(b){return b.account_id===accountId;}); }
function totalBalance(accountId){ return banksOf(accountId).reduce(function(s,b){return s+b.balance;},0); }
function familyTotal(){ return S.bankAccounts.reduce(function(s,b){return s+b.balance;},0); }
function txOfAccount(accountId){ return S.transactions.filter(function(t){return t.account_id===accountId;}); }
function otherAccountId(id){ var a = S.accounts.find(function(x){return x.id!==id;}); return a?a.id:null; }

function monthTxOf(accountId, ym){
  return txOfAccount(accountId).filter(function(t){ return monthKey(t.tanggal)===ym; });
}
function monthSummary(accountId, ym){
  var list = monthTxOf(accountId, ym);
  var out = {pendapatan:0, pengeluaran:0, transferIn:0, transferOut:0};
  list.forEach(function(t){
    if(t.jenis_transaksi==="PENDAPATAN") out.pendapatan += t.nominal;
    else if(t.jenis_transaksi==="PENGELUARAN") out.pengeluaran += t.nominal;
    else if(t.jenis_transaksi==="TRANSFER_IN") out.transferIn += t.nominal;
    else if(t.jenis_transaksi==="TRANSFER_OUT") out.transferOut += t.nominal;
  });
  out.sisa = out.pendapatan - out.pengeluaran + out.transferIn - out.transferOut;
  return out;
}

/* ============================================================
   ATOMIC-ISH LEDGER OPERATIONS (via lease lock + fresh reads)
============================================================ */
async function withLedgerLock(fn){
  if(!db){ return fn({ getBankFresh: function(id){ return Promise.resolve(getBank(id)); } }); }
  var holder = "op-"+Math.random().toString(36).slice(2);
  var lockRef = db.doc("meta/ledger_lock");
  var acquired = false;
  for(var i=0;i<6;i++){
    var res = await lockRef.acquire({holder:holder, ttlMs:6000});
    if(res.acquired){ acquired = true; break; }
    await new Promise(function(r){ setTimeout(r,350); });
  }
  if(!acquired){ throw new Error("Sistem sedang sibuk, coba lagi."); }
  var ctx = {
    getBankFresh: async function(id){
      var snap = await db.doc("bank_accounts/"+id).get();
      return snap.exists ? snap.data() : null;
    }
  };
  return fn(ctx);
}

async function saveTransaction(tx){
  tx.transaction_id = tx.transaction_id || uid("TX");
  tx.created_at = new Date().toISOString();
  if(db){ await db.doc("transactions/"+tx.transaction_id).set(tx); }
  else { S.transactions.unshift(tx); }
  return tx;
}
async function saveBankBalance(bankId, newBalance){
  if(db){ await db.doc("bank_accounts/"+bankId).update({balance:newBalance}); }
  else { var b = getBank(bankId); if(b) b.balance = newBalance; }
}

async function doIncome(data){
  return withLedgerLock(async function(ctx){
    var bank = await ctx.getBankFresh(data.bank_account_id);
    if(!bank) throw new Error("Rekening tidak ditemukan.");
    var r = applyIncome(bank, data.nominal);
    await saveBankBalance(bank.id, r.after);
    await saveTransaction({
      account_id: data.account_id, bank_account_id: bank.id, tanggal: data.tanggal,
      jenis_transaksi:"PENDAPATAN", kategori:data.kategori, nominal:data.nominal,
      rekening: bank.bank_name, keterangan: data.keterangan||"",
      saldo_sebelum:r.before, saldo_sesudah:r.after
    });
    if(!db){ render(); }
  });
}
async function doExpense(data){
  return withLedgerLock(async function(ctx){
    var bank = await ctx.getBankFresh(data.bank_account_id);
    if(!bank) throw new Error("Rekening tidak ditemukan.");
    var r = applyExpense(bank, data.nominal);
    if(r.error) throw new Error(r.error);
    await saveBankBalance(bank.id, r.after);
    await saveTransaction({
      account_id: data.account_id, bank_account_id: bank.id, tanggal: data.tanggal,
      jenis_transaksi:"PENGELUARAN", kategori:data.kategori, nominal:data.nominal,
      rekening: bank.bank_name, keterangan: data.keterangan||"",
      saldo_sebelum:r.before, saldo_sesudah:r.after
    });
    if(!db){ render(); }
  });
}
async function doTransferAntarAkun(data){
  // data: fromAccountId, toAccountId, fromBankId, toBankId, nominal, keterangan, tanggal
  return withLedgerLock(async function(ctx){
    var fromBank = await ctx.getBankFresh(data.fromBankId);
    var toBank = await ctx.getBankFresh(data.toBankId);
    var err = validateTransfer({nominal:data.nominal, fromBank:fromBank, toBank:toBank, fromAccountId:data.fromAccountId, toAccountId:data.toAccountId, isSelfTransfer:false});
    if(err) throw new Error(err);
    var transferId = uid("TRF");
    var fromAfter = fromBank.balance - data.nominal;
    var toAfter = toBank.balance + data.nominal;
    await saveBankBalance(fromBank.id, fromAfter);
    try{
      await saveBankBalance(toBank.id, toAfter);
    }catch(e){
      await saveBankBalance(fromBank.id, fromBank.balance); // rollback
      throw e;
    }
    var fromName = getAccount(data.fromAccountId).name;
    var toName = getAccount(data.toAccountId).name;
    await saveTransaction({
      account_id:data.fromAccountId, bank_account_id:fromBank.id, tanggal:data.tanggal,
      jenis_transaksi:"TRANSFER_OUT", kategori:"Transfer", nominal:data.nominal,
      rekening:fromBank.bank_name, keterangan: data.keterangan || ("Transfer ke "+toName),
      saldo_sebelum:fromBank.balance, saldo_sesudah:fromAfter,
      transfer_id:transferId, counterparty_account_id:data.toAccountId
    });
    await saveTransaction({
      account_id:data.toAccountId, bank_account_id:toBank.id, tanggal:data.tanggal,
      jenis_transaksi:"TRANSFER_IN", kategori:"Transfer", nominal:data.nominal,
      rekening:toBank.bank_name, keterangan: data.keterangan || ("Transfer dari "+fromName),
      saldo_sebelum:toBank.balance, saldo_sesudah:toAfter,
      transfer_id:transferId, counterparty_account_id:data.fromAccountId
    });
    if(!db){ render(); }
    return transferId;
  });
}
async function doTransferAntarRekening(data){
  // data: accountId, fromBankId, toBankId, nominal, keterangan, tanggal
  return withLedgerLock(async function(ctx){
    var fromBank = await ctx.getBankFresh(data.fromBankId);
    var toBank = await ctx.getBankFresh(data.toBankId);
    var err = validateTransfer({nominal:data.nominal, fromBank:fromBank, toBank:toBank, isSelfTransfer:true});
    if(err) throw new Error(err);
    var transferId = uid("TRFR");
    var fromAfter = fromBank.balance - data.nominal;
    var toAfter = toBank.balance + data.nominal;
    await saveBankBalance(fromBank.id, fromAfter);
    try{ await saveBankBalance(toBank.id, toAfter); }
    catch(e){ await saveBankBalance(fromBank.id, fromBank.balance); throw e; }
    await saveTransaction({
      account_id:data.accountId, bank_account_id:fromBank.id, tanggal:data.tanggal,
      jenis_transaksi:"TRANSFER_ANTAR_REKENING_OUT", kategori:"Transfer Rekening", nominal:data.nominal,
      rekening:fromBank.bank_name, keterangan: data.keterangan || ("Ke "+toBank.bank_name),
      saldo_sebelum:fromBank.balance, saldo_sesudah:fromAfter, transfer_id:transferId
    });
    await saveTransaction({
      account_id:data.accountId, bank_account_id:toBank.id, tanggal:data.tanggal,
      jenis_transaksi:"TRANSFER_ANTAR_REKENING_IN", kategori:"Transfer Rekening", nominal:data.nominal,
      rekening:toBank.bank_name, keterangan: data.keterangan || ("Dari "+fromBank.bank_name),
      saldo_sebelum:toBank.balance, saldo_sesudah:toAfter, transfer_id:transferId
    });
    if(!db){ render(); }
    return transferId;
  });
}
async function deleteTransaction(txId){
  var tx = S.transactions.find(function(t){return t.transaction_id===txId;});
  if(!tx) return;
  return withLedgerLock(async function(ctx){
    // reverse this tx's effect on its bank account
    var bank = await ctx.getBankFresh(tx.bank_account_id);
    if(bank){
      var newBal = bank.balance;
      if(tx.jenis_transaksi==="PENDAPATAN" || tx.jenis_transaksi==="TRANSFER_IN" || tx.jenis_transaksi==="TRANSFER_ANTAR_REKENING_IN"){
        newBal = bank.balance - tx.nominal;
      } else {
        newBal = bank.balance + tx.nominal;
      }
      await saveBankBalance(bank.id, newBal);
    }
    if(db){ await db.doc("transactions/"+tx.transaction_id).delete(); }
    else { S.transactions = S.transactions.filter(function(t){return t.transaction_id!==txId;}); }
    // if part of a transfer pair, reverse the counterpart too
    if(tx.transfer_id){
      var pair = S.transactions.find(function(t){return t.transfer_id===tx.transfer_id && t.transaction_id!==txId;});
      if(pair){
        var bank2 = await ctx.getBankFresh(pair.bank_account_id);
        if(bank2){
          var newBal2 = bank2.balance;
          if(pair.jenis_transaksi==="PENDAPATAN" || pair.jenis_transaksi==="TRANSFER_IN" || pair.jenis_transaksi==="TRANSFER_ANTAR_REKENING_IN"){
            newBal2 = bank2.balance - pair.nominal;
          } else {
            newBal2 = bank2.balance + pair.nominal;
          }
          await saveBankBalance(bank2.id, newBal2);
        }
        if(db){ await db.doc("transactions/"+pair.transaction_id).delete(); }
        else { S.transactions = S.transactions.filter(function(t){return t.transaction_id!==pair.transaction_id;}); }
      }
    }
    if(!db){ render(); }
  });
}

  if(t.jenis_transaksi==="PENGELUARAN") return {icon:CAT_ICON[t.kategori]||"⬇️", sign:"-", cls:"neg", title:t.kategori};
  if(t.jenis_transaksi==="TRANSFER_OUT") return {icon:"↗", sign:"-", cls:"neg", title:t.keterangan||"Transfer Keluar"};
  if(t.jenis_transaksi==="TRANSFER_IN") return {icon:"↙", sign:"+", cls:"pos", title:t.keterangan||"Transfer Masuk"};
  if(t.jenis_transaksi==="TRANSFER_ANTAR_REKENING_OUT") return {icon:"🔄", sign:"-", cls:"neu", title:t.keterangan||"Transfer Rekening"};
  if(t.jenis_transaksi==="TRANSFER_ANTAR_REKENING_IN") return {icon:"🔄", sign:"+", cls:"neu", title:t.keterangan||"Transfer Rekening"};
  return {icon:"📄", sign:"", cls:"", title:t.kategori||""};

  var running = currentTotal;

      options:{plugins:{legend:{display:false}}, scales:{
        x:{ticks:{color:"#93A0C2"}, grid:{display:false}},
        y:{ticks:{color:"#93A0C2", callback:function(v){return (v/1000000).toFixed(1)+"jt";}}, grid:{color:"#26314E"}}
      }}

  }
  var elC = document.getElementById("chartCategory");
  if(elC){
    var ym = todayISO().slice(0,7);

    });
    var entries = Object.keys(byCat).map(function(k){return {k:k,v:byCat[k]};}).sort(function(a,b){return b.v-a.v;});
    var palette = ["#F0555F","#F0A94C","#5B85F5","#34D07E","#B892FF","#4DD0E1","#F2789F","#C9D14D"];

/* ---------- RIWAYAT ---------- */
function riwayatFiltered(){
  var list = txOfAccount(S.currentUser);
  var h = S.hist;
  if(h.filterType==="Pendapatan") list = list.filter(function(t){return t.jenis_transaksi==="PENDAPATAN";});
  else if(h.filterType==="Pengeluaran") list = list.filter(function(t){return t.jenis_transaksi==="PENGELUARAN";});
  else if(h.filterType==="Transfer Masuk") list = list.filter(function(t){return t.jenis_transaksi==="TRANSFER_IN";});
  else if(h.filterType==="Transfer Keluar") list = list.filter(function(t){return t.jenis_transaksi==="TRANSFER_OUT";});

  var now = new Date(); var todayStr = todayISO();
  if(h.filterDate==="Hari ini") list = list.filter(function(t){return t.tanggal===todayStr;});
  else if(h.filterDate==="Minggu ini"){
    var d0 = new Date(); d0.setDate(d0.getDate()-7);
    list = list.filter(function(t){return new Date(t.tanggal)>=d0;});
  } else if(h.filterDate==="Bulan ini"){
    var ym = todayStr.slice(0,7);
    list = list.filter(function(t){return monthKey(t.tanggal)===ym;});
  }
  if(h.filterBank && h.filterBank!=="Semua rekening") list = list.filter(function(t){return t.rekening===h.filterBank;});
  if(h.search) {
    var q = h.search.toLowerCase();
    list = list.filter(function(t){ return (t.keterangan||"").toLowerCase().indexOf(q)>=0 || (t.kategori||"").toLowerCase().indexOf(q)>=0; });
  }
  return list;
}
function renderRiwayat(){
  var h = S.hist;
  var banks = banksOf(S.currentUser).map(function(b){return b.bank_name;});
  var list = riwayatFiltered();
  var groups = {};
  list.forEach(function(t){ (groups[t.tanggal]=groups[t.tanggal]||[]).push(t); });
  var dates = Object.keys(groups).sort().reverse();

  var html = '<div class="kk-page">';
  html += '<div class="kk-search-row"><div class="kk-search-box">🔍<input id="histSearch" placeholder="Cari transaksi" value="'+esc(h.search)+'"></div></div>';
  html += '<div class="kk-chip-row">'+["Semua","Pendapatan","Pengeluaran","Transfer Masuk","Transfer Keluar"].map(function(o){
    return '<button class="kk-chip '+(h.filterType===o?"active":"")+'" data-act="setFilter" data-key="filterType" data-val="'+esc(o)+'">'+esc(o)+'</button>';
  }).join("")+'</div>';
  html += '<div class="kk-chip-row">'+["Hari ini","Minggu ini","Bulan ini","Semua"].map(function(o){
    return '<button class="kk-chip '+(h.filterDate===o?"active":"")+'" data-act="setFilter" data-key="filterDate" data-val="'+esc(o)+'">'+esc(o)+'</button>';
  }).join("")+'</div>';
  html += '<div class="kk-chip-row">'+["Semua rekening"].concat(banks).map(function(o){
    return '<button class="kk-chip '+(h.filterBank===o?"active":"")+'" data-act="setFilter" data-key="filterBank" data-val="'+esc(o)+'">'+esc(o)+'</button>';
  }).join("")+'</div>';

  html += '<button class="kk-btn secondary" data-act="exportExcel" style="margin-bottom:10px;">⬇ Export Excel</button>';

  if(!dates.length) html += '<div class="kk-empty">Tidak ada transaksi untuk filter ini.</div>';

/* ============================================================
   EVENTS
============================================================ */
function wireEvents(){
  var root = document.getElementById("root");
  root.onclick = function(e){
    var stopEl = e.target.closest('[data-stop]');
    if(e.target.classList && e.target.classList.contains("kk-sheet-backdrop")){
      S.modal = null; S.formErr=null; render(); return;
    }
    var el = e.target.closest("[data-act]");
    if(!el) return;
    var act = el.getAttribute("data-act");
    handleAction(act, el, e);
  };
  var search = document.getElementById("histSearch");
  if(search){ search.oninput = function(){ S.hist.search = search.value; renderRiwayatOnly(); }; }
  var restoreInput = document.getElementById("restoreFile");
  if(restoreInput){ restoreInput.onchange = handleRestoreFile; }
}
function renderRiwayatOnly(){
  var scr = document.getElementById("kkScreen");
  if(scr) scr.innerHTML = renderPage();
  wireEvents();
}

async function handleAction(act, el, e){
  S.formErr = null;
  switch(act){
    case "back":
      S.page="home"; S.modal=null; render(); break;
    case "goto":
      S.page = el.getAttribute("data-page"); S.modal=null; render(); break;
    case "gotoTransfer":
      S.page="transfer"; S.modal=null; render(); break;
    case "openModal":
      S.modal = {type: el.getAttribute("data-modal")}; render(); break;
    case "closeModal":
      S.modal=null; render(); break;
    case "openDetail":
      S.modal = {type:"detail", id: el.getAttribute("data-id")}; render(); break;
    case "openDetailRekening":
      toast("Rekening: "+ (getBank(el.getAttribute("data-id"))||{}).bank_name); break;
    case "openProfilePicker":
      S.modal = {type:"profilePicker"}; render(); break;
    case "switchUser":
      S.currentUser = el.getAttribute("data-id");
      localStorage.setItem("kk_current_user", S.currentUser);
      S.modal=null; S.page="home"; render(); break;
    case "setFilter":
      S.hist[el.getAttribute("data-key")] = el.getAttribute("data-val");
      renderRiwayatOnly(); break;
    case "setTransferMode":
      S._transferMode = el.getAttribute("data-mode"); S.formErr=null; render(); break;
    case "pickField": {
      var formKey = "_"+el.getAttribute("data-form")+"Form";
      S[formKey] = S[formKey]||{};
      S[formKey][el.getAttribute("data-field")] = el.getAttribute("data-val");
      render(); break;
    }
    case "submitIncome": await submitIncomeHandler(); break;
    case "submitExpense": await submitExpenseHandler(); break;
    case "submitTransferAkun": await submitTransferAkunHandler(); break;
    case "submitTransferRekening": await submitTransferRekeningHandler(); break;
    case "submitBankForm": await submitBankFormHandler(); break;
    case "confirmDeleteTx": await confirmDeleteTxHandler(el.getAttribute("data-id")); break;
    case "exportExcel": exportExcel("mine"); break;
    case "exportExcelSaya": exportExcel("mine"); break;
    case "exportExcelKeluarga": exportExcel("family"); break;
    case "exportBackupJSON": exportBackupJSON(); break;
    case "triggerRestore": document.getElementById("restoreFile").click(); break;
    case "runTests": S._testResults = runSelfTests(); render(); break;
  }
}

/* ============================================================
   EXPORT EXCEL / BACKUP
============================================================ */
function txToRow(t, no){
  var srcAcc = getAccount(t.account_id);
  var counterparty = t.counterparty_account_id ? getAccount(t.counterparty_account_id) : null;
  var fromAcc = t.jenis_transaksi==="TRANSFER_OUT" ? srcAcc : (counterparty||null);
  var toAcc = t.jenis_transaksi==="TRANSFER_IN" ? srcAcc : (counterparty||null);
  return {
    "No": no,
    "Tanggal": fmtDateShort(t.tanggal),
    "Akun": srcAcc?srcAcc.name:t.account_id,
    "Jenis Transaksi": t.jenis_transaksi,
    "Kategori": t.kategori||"",
    "Nominal": t.nominal,
    "Rekening": t.rekening||"",
    "Keterangan": t.keterangan||"",
    "Transfer ID": t.transfer_id||"",
    "Akun Sumber": fromAcc?fromAcc.name:"",
    "Akun Tujuan": toAcc?toAcc.name:"",
    "Saldo Sebelum": t.saldo_sebelum,
    "Saldo Sesudah": t.saldo_sesudah
  };
}
async function exportExcel(scope){
  if(typeof XLSX==="undefined"){ toast("Modul Excel belum siap."); return; }
  var list = scope==="family" ? S.transactions.slice() : txOfAccount(S.currentUser);
  list = list.slice().sort(function(a,b){ return a.tanggal<b.tanggal?-1:1; });
  var rows = list.map(function(t,i){ return txToRow(t, i+1); });
  var ws = XLSX.utils.json_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Transaksi");
  var arr = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  var blob = new Blob([arr], {type:"application/octet-stream"});
  var d = new Date();
  var uname = scope==="family" ? "Kas_Keluarga" : getAccount(S.currentUser).name.replace(/\s+/g,"");
  var fname = "KeuanganKu_"+uname+"_"+MONTHS_FULL_ID[d.getMonth()]+"_"+d.getFullYear()+".xlsx";
  await offerDownload(fname, blob);
}
async function exportBackupJSON(){
  var payload = {accounts:S.accounts, bank_accounts:S.bankAccounts, transactions:S.transactions, exported_at:new Date().toISOString()};
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  var fname = "KeuanganKu_Backup_"+todayISO()+".json";
  await offerDownload(fname, blob);
}
async function offerDownload(filename, blob){
  if(downloads){
    try{
      await downloads.save({filename:filename, data:blob});
      toast("Berhasil diunduh.");
    }catch(err){ toast("Unduhan dibatalkan atau gagal."); }
  } else {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
  }
}
function handleRestoreFile(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = async function(){
    try{
      var data = JSON.parse(reader.result);
      if(data.bank_accounts){
        for(var i=0;i<data.bank_accounts.length;i++){
          var b = data.bank_accounts[i];
          if(db) await db.doc("bank_accounts/"+b.id).set(b);
          else { var idx=S.bankAccounts.findIndex(function(x){return x.id===b.id;}); if(idx>=0) S.bankAccounts[idx]=b; else S.bankAccounts.push(b); }
        }
      }
      if(data.transactions){
        for(var j=0;j<data.transactions.length;j++){
          var t = data.transactions[j];
          if(db) await db.doc("transactions/"+t.transaction_id).set(t);
          else if(!S.transactions.find(function(x){return x.transaction_id===t.transaction_id;})) S.transactions.push(t);
        }
      }
      toast("Data berhasil dipulihkan.");
      render();
    }catch(err){ toast("File backup tidak valid."); }
  };
  reader.readAsText(file);
}

/* ============================================================
   SELF TESTS (pure logic, in-memory clone — never touches real data)
============================================================ */
function runSelfTests(){
  var results = [];
  function bankObj(bal){ return {id:"X", balance:bal}; }

  // TEST 1: Dimas transfer 1.000.000 ke Nur Santi
  (function(){
    var dimas = bankObj(5000000), nur = bankObj(2518000);
    var err = validateTransfer({nominal:1000000, fromBank:dimas, toBank:nur, fromAccountId:"DIMAS", toAccountId:"NURSANTI"});
    var pass = !err;
    if(pass){ dimas.balance -= 1000000; nur.balance += 1000000; pass = dimas.balance===4000000 && nur.balance===3518000 && (dimas.balance+nur.balance)===7518000; }
    results.push({name:"Test 1: Transfer Dimas → Nur Santi Rp1.000.000", pass:pass});
  })();

  // TEST 2: Nur Santi transfer 500.000 ke Dimas (lanjutan test 1)
  (function(){
    var dimas = bankObj(4000000), nur = bankObj(3518000);
    var err = validateTransfer({nominal:500000, fromBank:nur, toBank:dimas, fromAccountId:"NURSANTI", toAccountId:"DIMAS"});
    var pass = !err;
    if(pass){ nur.balance -= 500000; dimas.balance += 500000; pass = nur.balance===3018000 && dimas.balance===4500000 && (dimas.balance+nur.balance)===7518000; }
    results.push({name:"Test 2: Transfer Nur Santi → Dimas Rp500.000", pass:pass});
  })();

  // TEST 3: Dimas menerima pendapatan 2.000.000 (dari saldo 4.500.000)
  (function(){
    var dimas = bankObj(4500000);
    var r = applyIncome(dimas, 2000000);
    results.push({name:"Test 3: Pendapatan Dimas +Rp2.000.000", pass: r.after===6500000});
  })();

  // TEST 4: Dimas pengeluaran 1.500.000 (dari saldo 6.500.000)
  (function(){
    var dimas = bankObj(6500000);
    var r = applyExpense(dimas, 1500000);
    results.push({name:"Test 4: Pengeluaran Dimas -Rp1.500.000", pass: !r.error && r.after===5000000});
  })();

  // TEST 5: Transfer Rp10.000.000 saat saldo Dimas hanya Rp5.000.000 -> ditolak
  (function(){
    var dimas = bankObj(5000000), nur = bankObj(2518000);
    var err = validateTransfer({nominal:10000000, fromBank:dimas, toBank:nur, fromAccountId:"DIMAS", toAccountId:"NURSANTI"});
    results.push({name:"Test 5: Transfer melebihi saldo ditolak", pass: err==="Saldo tidak mencukupi."});
  })();

  // TEST 6: Validasi nominal 0 / negatif / rekening sama ditolak
  (function(){
    var dimas = bankObj(5000000), nur = bankObj(2518000);
    var e1 = validateTransfer({nominal:0, fromBank:dimas, toBank:nur, fromAccountId:"DIMAS", toAccountId:"NURSANTI"});
    var e2 = validateTransfer({nominal:-100, fromBank:dimas, toBank:nur, fromAccountId:"DIMAS", toAccountId:"NURSANTI"});
    var e3 = validateTransfer({nominal:100, fromBank:dimas, toBank:dimas, fromAccountId:"DIMAS", toAccountId:"DIMAS"});
    results.push({name:"Test 6: Validasi nominal 0/negatif/akun sama", pass: !!e1 && !!e2 && !!e3});
  })();

  // TEST 7: Total kas keluarga tetap sama setelah beberapa transfer internal
  (function(){
    var dimas = bankObj(5000000), nur = bankObj(2518000);
    var total0 = dimas.balance+nur.balance;
    dimas.balance -= 1000000; nur.balance += 1000000;
    nur.balance -= 500000; dimas.balance += 500000;
    var total1 = dimas.balance+nur.balance;
    results.push({name:"Test 7: Total kas keluarga tidak berubah akibat transfer", pass: total0===total1});
  })();

  return results;
}
