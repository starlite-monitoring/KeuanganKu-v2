<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>KeuanganKu</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
html, body { margin: 0; padding: 0; background: #F5F7FB; min-height: 100vh; }
#root { display: flex; justify-content: center; width: 100%; min-height: 100vh; }

.kk-root {
  --kk-primary: #2C5CE0; --kk-primary-dark: #1E3FAE; --kk-primary-light: #E8EEFE;
  --kk-bg: #F5F7FB; --kk-surface: #FFFFFF; --kk-surface-alt: #EEF2FB;
  --kk-text: #16213E; --kk-text-secondary: #6B7594;
  --kk-success: #16A34A; --kk-success-light: #E7F8ED;
  --kk-danger: #E23744; --kk-danger-light: #FCEAEB;
  --kk-warning: #E8912D; --kk-warning-light: #FDF1E1;
  --kk-border: #E7EBF5; --kk-radius: 16px; --kk-shadow: 0 4px 16px rgba(22,33,62,0.06);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex; justify-content: center; width: 100%;
}
.kk-root[data-theme="dark"] {
  --kk-primary: #5B85F5; --kk-primary-dark: #4468D6; --kk-primary-light: #1E2C4C;
  --kk-bg: #0E1526; --kk-surface: #16203A; --kk-surface-alt: #1C2740;
  --kk-text: #EDF1FB; --kk-text-secondary: #93A0C2;
  --kk-success: #34D07E; --kk-success-light: #12301F;
  --kk-danger: #F0555F; --kk-danger-light: #3A1518;
  --kk-warning: #F0A94C; --kk-warning-light: #3A2A12;
  --kk-border: #26314E; --kk-shadow: 0 4px 20px rgba(0,0,0,0.35);
}
.kk-root * { box-sizing: border-box; }
.kk-phone { width: 100%; max-width: 430px; background: var(--kk-bg); color: var(--kk-text); min-height: 100vh; position: relative; display: flex; flex-direction: column; }
@media (min-width: 480px) {
  .kk-phone { min-height: 92vh; margin: 4vh 0; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 60px rgba(22,33,62,0.18); }
}
.kk-splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 500px; gap: 8px; color: var(--kk-text); }
.kk-splash-badge { width: 56px; height: 56px; border-radius: 18px; background: var(--kk-primary); color: #fff; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; font-size: 24px; }
.kk-splash-title { font-size: 17px; font-weight: 700; margin: 0; }
.kk-splash-sub { font-size: 13px; color: var(--kk-text-secondary); margin: 0; }

.kk-screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.kk-page { padding: 18px 16px 8px; }
.kk-page-body { padding: 14px 16px 8px; }
.kk-page-title { font-size: 20px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.2px; }

.kk-topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; border-bottom: 1px solid var(--kk-border); position: sticky; top: 0; background: var(--kk-surface); z-index: 5; }
.kk-topbar-title { font-size: 16px; font-weight: 700; margin: 0; }
.kk-icon-btn { width: 36px; height: 36px; border-radius: 12px; border: none; background: var(--kk-surface-alt); color: var(--kk-text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.kk-icon-btn:active { transform: scale(0.94); }
.kk-icon-btn.xs { width: 30px; height: 30px; border-radius: 9px; }
.kk-icon-btn.danger { color: var(--kk-danger); background: var(--kk-danger-light); }

.kk-dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.kk-greeting { font-size: 13px; color: var(--kk-text-secondary); margin: 0; }
.kk-greeting-name { font-size: 19px; font-weight: 700; margin: 2px 0 0; }
.kk-avatar-sm { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }

.kk-balance-card { background: linear-gradient(135deg, var(--kk-primary) 0%, var(--kk-primary-dark) 100%); border-radius: var(--kk-radius); padding: 20px; color: #fff; position: relative; overflow: hidden; margin-bottom: 14px; }
.kk-balance-sparkline { position: absolute; bottom: 0; left: 0; right: 0; opacity: 0.9; }
.kk-balance-label { font-size: 12.5px; opacity: 0.85; margin: 0 0 6px; position: relative; }
.kk-balance-value { font-size: 27px; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.3px; position: relative; font-variant-numeric: tabular-nums; }
.kk-balance-value.dark { color: var(--kk-text); font-size: 24px; }
.kk-wallets-link { background: rgba(255,255,255,0.16); border: none; border-radius: 100px; color: #fff; font-size: 12px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; position: relative; }

.kk-kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.kk-kpi-card { background: var(--kk-surface); border-radius: 14px; padding: 14px; box-shadow: var(--kk-shadow); }
.kk-kpi-card.income { border-left: 3px solid var(--kk-success); }
.kk-kpi-card.expense { border-left: 3px solid var(--kk-danger); }
.kk-kpi-icon { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.kk-kpi-card.income .kk-kpi-icon { background: var(--kk-success-light); color: var(--kk-success); }
.kk-kpi-card.expense .kk-kpi-icon { background: var(--kk-danger-light); color: var(--kk-danger); }
.kk-kpi-label { font-size: 12px; color: var(--kk-text-secondary); margin: 0 0 4px; }
.kk-kpi-value { font-size: 16px; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
.kk-kpi-value.neg { color: var(--kk-danger); }

.kk-alert-banner { display: flex; align-items: center; gap: 8px; background: var(--kk-warning-light); color: var(--kk-warning); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; cursor: pointer; }

.kk-card { background: var(--kk-surface); border-radius: var(--kk-radius); padding: 16px; box-shadow: var(--kk-shadow); margin-bottom: 12px; }
.kk-card.no-pad { padding: 4px; }
.kk-card-title { font-size: 14.5px; font-weight: 700; margin: 0 0 4px; }
.kk-card-sub { font-size: 12px; color: var(--kk-text-secondary); margin: 0 0 8px; }
.kk-card-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.kk-link-btn { background: none; border: none; color: var(--kk-primary); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px; }

.kk-legend-row { display: flex; gap: 14px; justify-content: center; margin-top: 6px; }
.kk-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--kk-text-secondary); }
.kk-legend-item i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

.kk-cat-list { margin-top: 8px; display: flex; flex-direction: column; gap: 9px; }
.kk-cat-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.kk-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.kk-cat-name { flex: 1; color: var(--kk-text); }
.kk-cat-val { font-weight: 600; font-variant-numeric: tabular-nums; }
.kk-rank { width: 20px; height: 20px; border-radius: 50%; background: var(--kk-primary-light); color: var(--kk-primary-dark); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.kk-tx-list { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.kk-tx-row { display: flex; align-items: center; gap: 10px; background: none; border: none; width: 100%; padding: 8px 4px; cursor: pointer; text-align: left; border-radius: 10px; }
.kk-tx-row:active, .kk-tx-row-clickable:active { background: var(--kk-surface-alt); }
.kk-tx-icon { width: 36px; height: 36px; border-radius: 11px; background: var(--kk-surface-alt); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.kk-tx-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.kk-tx-desc { font-size: 13.5px; font-weight: 600; color: var(--kk-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kk-tx-date { font-size: 11.5px; color: var(--kk-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kk-tx-amt { font-size: 13.5px; font-weight: 700; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.kk-tx-amt.pos { color: var(--kk-success); }
.kk-tx-amt.neg { color: var(--kk-danger); }

.kk-tx-group { margin-bottom: 12px; }
.kk-tx-group-date { font-size: 12px; font-weight: 600; color: var(--kk-text-secondary); margin: 0 0 6px 4px; }
.kk-tx-row-full { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 12px; }
.kk-tx-row-clickable { display: flex; align-items: center; gap: 10px; background: none; border: none; flex: 1; min-width: 0; padding: 6px; cursor: pointer; text-align: left; border-radius: 10px; }
.kk-tx-actions { display: flex; gap: 4px; flex-shrink: 0; }

.kk-search-row { display: flex; gap: 8px; margin-bottom: 10px; }
.kk-search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--kk-surface); border: 1px solid var(--kk-border); border-radius: 12px; padding: 0 12px; height: 42px; color: var(--kk-text-secondary); }
.kk-search-box input { flex: 1; border: none; outline: none; background: none; font-size: 13.5px; color: var(--kk-text); height: 100%; }
.kk-search-box button { background: none; border: none; color: var(--kk-text-secondary); cursor: pointer; display: flex; }
.kk-filter-btn { position: relative; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--kk-border); background: var(--kk-surface); color: var(--kk-text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.kk-filter-btn.active { border-color: var(--kk-primary); color: var(--kk-primary); }
.kk-filter-badge { position: absolute; top: -4px; right: -4px; background: var(--kk-primary); color: #fff; font-size: 9px; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

.kk-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.kk-chip { background: var(--kk-surface); border: 1px solid var(--kk-border); border-radius: 100px; padding: 7px 13px; font-size: 12.5px; color: var(--kk-text-secondary); cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.kk-chip.active { background: var(--kk-primary); border-color: var(--kk-primary); color: #fff; }
.kk-chip.sort { margin-left: auto; }

.kk-fab { position: absolute; right: 16px; bottom: 82px; width: 54px; height: 54px; border-radius: 50%; background: var(--kk-primary); color: #fff; border: none; box-shadow: 0 6px 16px rgba(44,92,224,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; }
.kk-fab:active { transform: scale(0.94); }

.kk-bottomnav { position: sticky; bottom: 0; display: flex; background: var(--kk-surface); border-top: 1px solid var(--kk-border); padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 15; }
.kk-navitem { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--kk-text-secondary); font-size: 10.5px; padding: 4px; cursor: pointer; }
.kk-navitem.active { color: var(--kk-primary); font-weight: 600; }

.kk-overlay { position: fixed; inset: 0; background: rgba(10,15,30,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.kk-fullsheet { background: var(--kk-bg); width: 100%; max-width: 430px; height: 100%; max-height: 100%; display: flex; flex-direction: column; }
.kk-form-scroll { flex: 1; overflow-y: auto; padding: 16px; }
.kk-form-footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--kk-border); background: var(--kk-surface); }

.kk-sheet { background: var(--kk-surface); width: 100%; max-width: 430px; border-radius: 20px 20px 0 0; padding: 10px 18px 22px; max-height: 85vh; overflow-y: auto; }
.kk-sheet-handle { width: 36px; height: 4px; background: var(--kk-border); border-radius: 4px; margin: 4px auto 14px; }
.kk-sheet-title { font-size: 16px; font-weight: 700; margin: 0 0 14px; }
.kk-sheet-actions { display: flex; gap: 10px; margin-top: 18px; }

.kk-field-label { font-size: 12.5px; font-weight: 600; color: var(--kk-text-secondary); margin: 14px 0 6px; }
.kk-field-label:first-child { margin-top: 0; }
.kk-input, .kk-select, .kk-textarea { width: 100%; border: 1px solid var(--kk-border); background: var(--kk-surface); color: var(--kk-text); border-radius: 12px; padding: 11px 13px; font-size: 13.5px; outline: none; font-family: inherit; }
.kk-input.err, .kk-select.err { border-color: var(--kk-danger); }
.kk-textarea { resize: vertical; }
.kk-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kk-error { color: var(--kk-danger); font-size: 11.5px; margin: 5px 0 0; }

.kk-segmented { display: flex; background: var(--kk-surface-alt); border-radius: 12px; padding: 4px; gap: 4px; }
.kk-seg-btn { flex: 1; border: none; background: none; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--kk-text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.kk-seg-btn.active.income { background: var(--kk-success); color: #fff; }
.kk-seg-btn.active.expense { background: var(--kk-danger); color: #fff; }
.kk-seg-btn.active:not(.income):not(.expense) { background: var(--kk-primary); color: #fff; }

.kk-amount-input { display: flex; align-items: center; gap: 6px; border: 1px solid var(--kk-border); border-radius: 12px; padding: 11px 13px; background: var(--kk-surface); }
.kk-amount-input.err { border-color: var(--kk-danger); }
.kk-amount-input span { font-size: 14px; font-weight: 700; color: var(--kk-text-secondary); }
.kk-amount-input input { flex: 1; border: none; outline: none; background: none; font-size: 17px; font-weight: 700; color: var(--kk-text); font-variant-numeric: tabular-nums; }

.kk-cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kk-cat-chip { display: flex; flex-direction: column; align-items: center; gap: 5px; background: var(--kk-surface-alt); border: 1.5px solid transparent; border-radius: 12px; padding: 10px 4px; cursor: pointer; font-size: 11px; color: var(--kk-text); text-align: center; }
.kk-cat-chip.active { border-color: var(--kk-primary); background: var(--kk-primary-light); color: var(--kk-primary-dark); font-weight: 600; }
.kk-cat-chip-icon { font-size: 19px; }

.kk-upload-box { width: 100%; border: 1.5px dashed var(--kk-border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--kk-surface-alt); color: var(--kk-text-secondary); cursor: pointer; font-size: 12.5px; }
.kk-receipt-preview { position: relative; width: 100px; height: 100px; border-radius: 12px; overflow: hidden; }
.kk-receipt-preview img { width: 100%; height: 100%; object-fit: cover; }
.kk-receipt-remove { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.kk-btn { border: none; border-radius: 12px; padding: 12px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.kk-btn.primary { background: var(--kk-primary); color: #fff; }
.kk-btn.danger { background: var(--kk-danger); color: #fff; }
.kk-btn.ghost { background: var(--kk-surface-alt); color: var(--kk-text); }
.kk-btn.secondary { background: var(--kk-surface); color: var(--kk-primary); border: 1px solid var(--kk-primary); }
.kk-btn.full { width: 100%; margin-top: 4px; }
.kk-btn:active { transform: scale(0.98); }
.kk-btn:disabled { opacity: 0.55; cursor: not-allowed; }

.kk-toggle { width: 42px; height: 24px; border-radius: 100px; background: var(--kk-border); border: none; position: relative; cursor: pointer; flex-shrink: 0; }
.kk-toggle.on { background: var(--kk-primary); }
.kk-toggle-knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left 0.15s; }
.kk-toggle.on .kk-toggle-knob { left: 20px; }

.kk-progress-track { width: 100%; height: 8px; background: var(--kk-surface-alt); border-radius: 100px; overflow: hidden; }
.kk-progress-fill { height: 100%; border-radius: 100px; transition: width 0.2s; }
.kk-progress-fill.tone-primary { background: var(--kk-primary); }
.kk-progress-fill.tone-warning { background: var(--kk-warning); }
.kk-progress-fill.tone-danger { background: var(--kk-danger); }

.kk-budget-pct { font-size: 12px; font-weight: 700; }
.kk-budget-pct.tone-primary { color: var(--kk-primary); }
.kk-budget-pct.tone-warning { color: var(--kk-warning); }
.kk-budget-pct.tone-danger { color: var(--kk-danger); }
.kk-status-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 100px; }
.kk-status-pill.tone-warning { background: var(--kk-warning-light); color: var(--kk-warning); }
.kk-status-pill.tone-danger { background: var(--kk-danger-light); color: var(--kk-danger); }

.kk-wallet-card { display: flex; align-items: center; gap: 12px; background: var(--kk-surface); border-radius: 14px; padding: 14px; box-shadow: var(--kk-shadow); margin-bottom: 10px; }
.kk-wallet-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--kk-surface-alt); display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; }
.kk-wallet-info { flex: 1; min-width: 0; }
.kk-wallet-name { font-size: 13.5px; font-weight: 700; margin: 0; }
.kk-wallet-type { font-size: 11.5px; color: var(--kk-text-secondary); margin: 2px 0 0; }
.kk-wallet-right { text-align: right; flex-shrink: 0; }
.kk-wallet-balance { font-size: 13.5px; font-weight: 700; margin: 0 0 4px; font-variant-numeric: tabular-nums; }
.kk-wallet-balance.neg { color: var(--kk-danger); }

.kk-icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.kk-icon-choice { width: 100%; aspect-ratio: 1; border-radius: 10px; background: var(--kk-surface-alt); border: 1.5px solid transparent; font-size: 17px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.kk-icon-choice.active { border-color: var(--kk-primary); background: var(--kk-primary-light); }
.kk-color-choice { width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; }

.kk-export-opt { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--kk-surface-alt); border: none; border-radius: 12px; padding: 13px; font-size: 13.5px; color: var(--kk-text); margin-bottom: 8px; cursor: pointer; }
.kk-export-opt span { flex: 1; text-align: left; font-weight: 600; }

.kk-profile-header { display: flex; align-items: center; gap: 12px; background: var(--kk-surface); border-radius: var(--kk-radius); padding: 16px; box-shadow: var(--kk-shadow); margin-bottom: 16px; }
.kk-avatar-lg { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
.kk-logout-btn { display: flex; align-items: center; gap: 5px; background: var(--kk-danger-light); color: var(--kk-danger); border: none; border-radius: 100px; padding: 8px 13px; font-size: 12px; font-weight: 700; cursor: pointer; }

.kk-section-label { font-size: 12px; font-weight: 700; color: var(--kk-text-secondary); text-transform: uppercase; letter-spacing: 0.4px; margin: 4px 0 8px 4px; }
.kk-menu-row { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 13px 10px; font-size: 13.5px; color: var(--kk-text); cursor: pointer; border-bottom: 1px solid var(--kk-border); text-align: left; }
.kk-menu-row:last-child { border-bottom: none; }
.kk-menu-row.danger { color: var(--kk-danger); }
.kk-menu-row span:nth-child(2) { flex: 1; }
.kk-menu-icon { width: 20px; display: flex; align-items: center; justify-content: center; }
.kk-menu-row-label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.kk-setting-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 10px; font-size: 13.5px; border-bottom: 1px solid var(--kk-border); }
.kk-setting-row:last-child { border-bottom: none; }
.kk-theme-switch { display: flex; align-items: center; gap: 5px; background: var(--kk-surface-alt); border: none; border-radius: 100px; padding: 6px 12px; font-size: 12px; color: var(--kk-text); cursor: pointer; }
.kk-app-version { text-align: center; font-size: 11px; color: var(--kk-text-secondary); margin: 18px 0 6px; }

.kk-info-note { font-size: 12px; color: var(--kk-text-secondary); background: var(--kk-surface-alt); padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
.kk-notif-row { display: flex; gap: 10px; align-items: flex-start; padding: 12px 10px; border-bottom: 1px solid var(--kk-border); }

/* ============================= CUSTOM SVG CHARTS (no dependency) ============================= */

function BarChartSVG({ data, series, height = 180 }) {
  const width = 340;
  const maxVal = Math.max(1, ...data.flatMap((d) => series.map((s) => d[s.key] || 0)));
  const padTop = 10, padBottom = 20;
  const chartH = height - padTop - padBottom;
  const groupW = width / Math.max(data.length, 1);
  const barW = Math.min(11, groupW / (series.length + 1.6));
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height }} preserveAspectRatio="xMidYMid meet">
      {data.map((d, i) => {
        const gx = i * groupW + groupW / 2;
        return (
          <g key={i}>
            {series.map((s, si) => {
              const val = d[s.key] || 0;
              const h = (val / maxVal) * chartH;
              const bx = gx - (series.length * barW) / 2 + si * barW;
              const by = padTop + (chartH - h);
              return <rect key={si} x={bx} y={by} width={Math.max(barW - 2, 2)} height={Math.max(h, 0)} rx={2} fill={s.color} />;
            })}
            <text x={gx} y={height - 4} fontSize="9" textAnchor="middle" fill="var(--kk-text-secondary)">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function LineChartSVG({ data, series, height = 170 }) {
  const width = 340;
  const maxVal = Math.max(1, ...data.flatMap((d) => series.map((s) => d[s.key] || 0)));
  const padTop = 10, padBottom = 20;
  const chartH = height - padTop - padBottom;
  const stepX = data.length > 1 ? width / (data.length - 1) : width;
  const labelEvery = Math.max(1, Math.ceil(data.length / 6));
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height }} preserveAspectRatio="xMidYMid meet">
      {series.map((s, si) => {
        const pts = data.map((d, i) => {
          const x = data.length > 1 ? i * stepX : width / 2;
          const y = padTop + (chartH - ((d[s.key] || 0) / maxVal) * chartH);
          return `${x},${y}`;
        }).join(" ");
        return <polyline key={si} points={pts} fill="none" stroke={s.color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />;
      })}
      {data.map((d, i) => {
        const x = data.length > 1 ? i * stepX : width / 2;
        return i % labelEvery === 0 ? <text key={i} x={x} y={height - 4} fontSize="8.5" textAnchor="middle" fill="var(--kk-text-secondary)">{d.label}</text> : null;
      })}
    </svg>
  );
}

function DonutChartSVG({ data, size = 168, strokeWidth = 24 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = (size - strokeWidth) / 2;
  const c = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <g transform={`rotate(-90 ${size / 2} ${size / 2})`}>
        {data.length === 0 ? (
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="var(--kk-border)" strokeWidth={strokeWidth} />
        ) : data.map((d, i) => {
          const frac = d.value / total;
          const len = frac * c;
          const dashoffset = -acc;
          acc += len;
          return <circle key={i} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={d.color} strokeWidth={strokeWidth} strokeDasharray={`${len} ${c - len}`} strokeDashoffset={dashoffset} />;
        })}
      </g>
    </svg>
  );
}

function isInPeriod(isoDate, period, customRange) {

  if (period === "week") {
    const dow = today0.getDay();
    const monday = new Date(today0); monday.setDate(today0.getDate() - ((dow + 6) % 7));
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    return d >= monday && d <= sunday;
  }
  if (period === "month") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  if (period === "year") return d.getFullYear() === now.getFullYear();
  if (period === "custom" && customRange?.start && customRange?.end) return d >= new Date(customRange.start + "T00:00:00") && d <= new Date(customRange.end + "T00:00:00");
  return true;
}
function downloadBlob(content, filename, mime) {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { console.error("Download failed", e); }
}

/* ---------- storage: shared = Supabase (semua device), personal = localStorage (device ini saja) ---------- */

function localGet(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function localSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

async function dbGet(key) {
  if (!supa) return null;
  try {
    const { data, error } = await supa.from("app_state").select("value").eq("key", key).maybeSingle();
    if (error || !data) return null;
    return data.value;
  } catch (e) { console.error(e); return null; }
}
async function dbSet(key, value) {
  if (!supa) return;
  try { await supa.from("app_state").upsert({ key, value, updated_at: new Date().toISOString() }); } catch (e) { console.error(e); }
}
async function storageGet(key, shared) { return shared ? await dbGet(key) : localGet(key); }
async function storageSet(key, value, shared) { return shared ? await dbSet(key, value) : localSet(key, value); }

/* ============================= ROOT APP (AUTH GATE) ============================= */

function App() {
  const [phase, setPhase] = useState("loading");
  const [profiles, setProfiles] = useState([]);
  const [sharedData, setSharedData] = useState(null);
  const [theme, setTheme] = useState("light");
  const [session, setSession] = useState(null);
  const [pinTarget, setPinTarget] = useState(null);
  const [pinError, setPinError] = useState("");
  const [lastUserId, setLastUserId] = useState(null);
  const [resetConfirm, setResetConfirm] = useState(false);
  const loadedOnce = useRef(false);
  const lastLocalChange = useRef(0);

  useEffect(() => {
    (async () => {
      const [p, d, prefs] = await Promise.all([storageGet(PROFILES_KEY, true), storageGet(DATA_KEY, true), storageGet(PREFS_KEY, false)]);
      setTheme(prefs?.theme || "light");
      setLastUserId(prefs?.lastUserId || null);
      if (!d) { const seed = generateSeedSharedData(); setSharedData(seed); storageSet(DATA_KEY, seed, true); } else setSharedData(d);
      if (!p || p.length === 0) setPhase("setup"); else { setProfiles(p); setPhase("login"); }
    })();
  }, []);

  useEffect(() => {
    if (!loadedOnce.current) { loadedOnce.current = true; return; }
    if (sharedData && phase === "app") {
      lastLocalChange.current = Date.now();
      const t = setTimeout(() => storageSet(DATA_KEY, sharedData, true), 350);
      return () => clearTimeout(t);
    }
  }, [sharedData]);

  useEffect(() => {
    if (phase !== "app") return;
    const poll = async () => {
      if (Date.now() - lastLocalChange.current < 3000) return;
      const fresh = await storageGet(DATA_KEY, true);
      if (fresh) setSharedData(fresh);
    };
    const iv = setInterval(poll, 15000);
    window.addEventListener("focus", poll);
    document.addEventListener("visibilitychange", poll);
    return () => { clearInterval(iv); window.removeEventListener("focus", poll); document.removeEventListener("visibilitychange", poll); };
  }, [phase]);

  const persistPrefs = (patch) => { const next = { theme, lastUserId, ...patch }; setTheme(next.theme); setLastUserId(next.lastUserId); storageSet(PREFS_KEY, next, false); };

  const finishSetup = async (newProfiles) => {
    setProfiles(newProfiles);
    await storageSet(PROFILES_KEY, newProfiles, true);
    if (!sharedData) { const seed = generateSeedSharedData(); setSharedData(seed); await storageSet(DATA_KEY, seed, true); }
    setPhase("login");
  };
  const requestLogin = (member) => { setPinTarget(member); setPinError(""); };
  const handlePinSubmit = (pin) => {
    if (pin === pinTarget.pin) { setSession(pinTarget); persistPrefs({ lastUserId: pinTarget.id }); setPinTarget(null); setPinError(""); setPhase("app"); }
    else setPinError("PIN salah, coba lagi");
  };
  const handleLogout = () => { setSession(null); setPhase("login"); };
  const updateProfiles = async (next) => { setProfiles(next); await storageSet(PROFILES_KEY, next, true); if (session) { const me = next.find((p) => p.id === session.id); if (me) setSession(me); } };
  const resetEverything = async () => {
    const seed = generateSeedSharedData();
    setSharedData(seed); setProfiles([]); setSession(null);
    await storageSet(DATA_KEY, seed, true); await storageSet(PROFILES_KEY, [], true);
    setResetConfirm(false); setPhase("setup");
  };

  if (!CONFIG_OK) {
    return (
      <div className="kk-root" data-theme="light">
        <div className="kk-phone">
          <div className="kk-splash" style={{ padding: 24, textAlign: "center" }}>
            <div className="kk-splash-badge">⚠️</div>
            <p className="kk-splash-title">Konfigurasi belum lengkap</p>
            <p className="kk-splash-sub">Buka file index.html, isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas script, sesuai panduan di README-DEPLOY.md.</p>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "loading" || !sharedData) {
    return <div className="kk-root" data-theme={theme}><div className="kk-phone"><div className="kk-splash"><div className="kk-splash-badge">💰</div><p className="kk-splash-title">KeuanganKu</p><p className="kk-splash-sub">Menyiapkan akun keluarga...</p></div></div></div>;
  }
  if (phase === "setup") {
    return <div className="kk-root" data-theme={theme}><div className="kk-phone"><SetupWizard onFinish={finishSetup} /></div></div>;
  }
  if (phase === "login") {
    return (
      <div className="kk-root" data-theme={theme}>
        <div className="kk-phone">
          {pinTarget ? (
            <div className="kk-page" style={{ display: "flex", flexDirection: "column", minHeight: 500 }}>
              <PinPad title={`Masuk sebagai ${pinTarget.name}`} subtitle="Masukkan PIN 4 digit kamu" memberColor={pinTarget.color} onSubmit={handlePinSubmit} onCancel={() => { setPinTarget(null); setPinError(""); }} error={pinError} />
            </div>
          ) : <LoginScreen profiles={profiles} lastUserId={lastUserId} onSelect={requestLogin} onManage={() => setPhase("manage-login")} />}
        </div>
      </div>
    );
  }
  if (phase === "manage-login") {
    return (
      <div className="kk-root" data-theme={theme}>
        <div className="kk-phone">
          <MembersView profiles={profiles} currentUser={null} onBack={() => setPhase("login")} onSave={updateProfiles} onResetAll={() => setResetConfirm(true)} />
          <ConfirmDialog open={resetConfirm} title="Hapus semua profil dan data?" message="Semua anggota, transaksi, kategori, rekening, dan anggaran akan dihapus permanen. Tindakan ini tidak bisa dibatalkan." onConfirm={resetEverything} onCancel={() => setResetConfirm(false)} />
        </div>
      </div>
    );
  }
  return (
    <div className="kk-root" data-theme={theme}>
      <div className="kk-phone">
        <MainApp sharedData={sharedData} setSharedData={setSharedData} currentUser={session} profiles={profiles} theme={theme} onToggleTheme={() => persistPrefs({ theme: theme === "dark" ? "light" : "dark" })} onLogout={handleLogout} onSaveProfiles={updateProfiles} />
      </div>
    </div>
  );
}

/* ============================= SETUP WIZARD ============================= */

function SetupWizard({ onFinish }) {
  const [step, setStep] = useState(-1);
  const [members, setMembers] = useState(Array.from({ length: MAX_MEMBERS }, (_, i) => ({ id: uid("mem"), name: "", avatar: AVATAR_CHOICES[i], color: MEMBER_COLORS[i], pin: "", pinConfirm: "" })));
  const [error, setError] = useState("");
  const current = members[step];
  const update = (patch) => setMembers((arr) => arr.map((m, i) => (i === step ? { ...m, ...patch } : m)));
  const next = () => {
    if (step === -1) { setStep(0); return; }
    if (!current.name.trim()) { setError("Nama wajib diisi"); return; }
    if (current.pin.length !== PIN_LENGTH) { setError(`PIN harus ${PIN_LENGTH} digit`); return; }
    if (current.pin !== current.pinConfirm) { setError("Konfirmasi PIN tidak cocok"); return; }
    setError("");
    if (step < MAX_MEMBERS - 1) setStep(step + 1); else onFinish(members.map(({ pinConfirm, ...m }) => m));
  };
  const back = () => { setError(""); if (step === 0) setStep(-1); else setStep(step - 1); };

  if (step === -1) {
    return (
      <div className="kk-page" style={{ display: "flex", flexDirection: "column", justifyContent: "center", minHeight: 560, textAlign: "center" }}>
        <div className="kk-splash-badge" style={{ margin: "0 auto 14px" }}>👨‍👩‍👧‍👦</div>
        <p className="kk-page-title" style={{ textAlign: "center" }}>Selamat datang di KeuanganKu</p>
        <p className="kk-card-sub" style={{ textAlign: "center", marginBottom: 24 }}>Buat 4 profil anggota keluarga. Semua orang mencatat ke satu kas bersama, dan setiap transaksi otomatis tercatat siapa yang menginput.</p>
        <button className="kk-btn primary full" onClick={next}>Mulai Buat Profil</button>
      </div>
    );
  }
  return (
    <div className="kk-page">
      <div className="kk-setup-progress">{Array.from({ length: MAX_MEMBERS }).map((_, i) => <span key={i} className={`kk-setup-dot ${i <= step ? "active" : ""}`} />)}</div>
      <p className="kk-page-title">Anggota {step + 1} dari {MAX_MEMBERS}</p>
      <p className="kk-field-label">Nama</p>
      <input className="kk-input" placeholder="Nama anggota" value={current.name} onChange={(e) => update({ name: e.target.value })} autoFocus />
      <p className="kk-field-label">Avatar</p>
      <div className="kk-icon-grid">{AVATAR_CHOICES.map((a, i) => <button key={i} className={`kk-icon-choice ${current.avatar === a ? "active" : ""}`} onClick={() => update({ avatar: a })}>{a}</button>)}</div>
      <p className="kk-field-label">Warna label</p>
      <div className="kk-chip-row">{MEMBER_COLORS.map((c) => <button key={c} className="kk-color-choice" style={{ background: c, outline: current.color === c ? `2.5px solid ${c}` : "none", outlineOffset: 2 }} onClick={() => update({ color: c })} />)}</div>
      <p className="kk-field-label">Buat PIN ({PIN_LENGTH} digit)</p>
      <input className="kk-input" inputMode="numeric" type="password" maxLength={PIN_LENGTH} placeholder="••••" value={current.pin} onChange={(e) => update({ pin: e.target.value.replace(/\D/g, "").slice(0, PIN_LENGTH) })} />
      <p className="kk-field-label">Konfirmasi PIN</p>
      <input className="kk-input" inputMode="numeric" type="password" maxLength={PIN_LENGTH} placeholder="••••" value={current.pinConfirm} onChange={(e) => update({ pinConfirm: e.target.value.replace(/\D/g, "").slice(0, PIN_LENGTH) })} />
      {error && <p className="kk-error">{error}</p>}
      <div className="kk-sheet-actions" style={{ marginTop: 22 }}><button className="kk-btn ghost" onClick={back}>Kembali</button><button className="kk-btn primary" onClick={next}>{step === MAX_MEMBERS - 1 ? "Selesai" : "Lanjut"}</button></div>
      <div style={{ height: 30 }} />
    </div>
  );
}

function MembersView({ profiles, currentUser, onBack, onSave, onResetAll }) {

  const openEdit = (p) => { setEditing(p); setName(p.name); setAvatar(p.avatar); setColor(p.color); setOldPin(""); setNewPin(""); setConfirmPin(""); setError(""); };
  const save = () => {
    if (!name.trim()) { setError("Nama wajib diisi"); return; }
    let pin = editing.pin;
    if (newPin || confirmPin || oldPin) {

/* ============================= MAIN APP (post-login) ============================= */

function MainApp({ sharedData, setSharedData, currentUser, profiles, theme, onToggleTheme, onLogout, onSaveProfiles }) {
  const data = sharedData;
  const [activeTab, setActiveTab] = useState("dashboard");
  const [subView, setSubView] = useState(null);
  const [showAddModal, setShowAddModal] = useState(false);
  const [editingTx, setEditingTx] = useState(null);
  const [confirmState, setConfirmState] = useState({ open: false });
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2400); return () => clearTimeout(t); }, [toast]);
  const showToast = useCallback((msg, tone = "success") => setToast({ msg, tone }), []);
  const setNotifSettings = (patch) => setSharedData((d) => ({ ...d, notifSettings: { ...d.notifSettings, ...patch } }));

  const upsertTransaction = (tx) => {
    setSharedData((d) => {
      const exists = d.transactions.some((t) => t.id === tx.id);
      const transactions = exists
        ? d.transactions.map((t) => (t.id === tx.id ? { ...t, ...tx, updatedAt: Date.now() } : t))
        : [{ ...tx, enteredById: currentUser.id, enteredByName: currentUser.name, createdAt: Date.now(), updatedAt: Date.now() }, ...d.transactions];
      return { ...d, transactions };
    });
    showToast(editingTx ? "Transaksi diperbarui" : "Transaksi disimpan");
  };
  const deleteTransaction = (id) => { setSharedData((d) => ({ ...d, transactions: d.transactions.filter((t) => t.id !== id) })); showToast("Transaksi dihapus", "danger"); };
  const addCategory = (cat) => setSharedData((d) => ({ ...d, categories: [...d.categories, { ...cat, id: uid("cat") }] }));
  const updateCategory = (id, patch) => setSharedData((d) => ({ ...d, categories: d.categories.map((c) => (c.id === id ? { ...c, ...patch } : c)) }));
  const deleteCategory = (id) => setSharedData((d) => ({ ...d, categories: d.categories.filter((c) => c.id !== id) }));
  const addWallet = (w) => setSharedData((d) => ({ ...d, wallets: [...d.wallets, { ...w, id: uid("wal"), createdAt: Date.now() }] }));
  const updateWallet = (id, patch) => setSharedData((d) => ({ ...d, wallets: d.wallets.map((w) => (w.id === id ? { ...w, ...patch } : w)) }));
  const deleteWallet = (id) => setSharedData((d) => ({ ...d, wallets: d.wallets.filter((w) => w.id !== id) }));
  const upsertBudget = (b) => setSharedData((d) => { const exists = d.budgets.some((x) => x.id === b.id); const budgets = exists ? d.budgets.map((x) => (x.id === b.id ? b : x)) : [...d.budgets, { ...b, id: uid("bud") }]; return { ...d, budgets }; });
  const deleteBudget = (id) => setSharedData((d) => ({ ...d, budgets: d.budgets.filter((b) => b.id !== id) }));

  const exportJSON = () => { downloadBlob(JSON.stringify({ profiles, data }, null, 2), `keuanganku-backup-${todayISO()}.json`, "application/json"); showToast("Backup data berhasil diunduh"); };
  const importJSON = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => { try { const parsed = JSON.parse(e.target.result); if (parsed.data) setSharedData(parsed.data); else if (parsed.transactions) setSharedData(parsed); showToast("Data berhasil diimpor"); } catch (err) { showToast("File tidak valid", "danger"); } };
    reader.readAsText(file);
  };
  const resetTransactionsOnly = () => { const seed = generateSeedSharedData(); setSharedData((d) => ({ ...seed, notifSettings: d.notifSettings })); showToast("Data transaksi direset", "danger"); };

  return (
    <>
      {subView === "kategori" && <KategoriView categories={data.categories} onBack={() => setSubView(null)} onAdd={addCategory} onUpdate={updateCategory} onDelete={(id) => { if (data.transactions.some((t) => t.categoryId === id)) { showToast("Kategori dipakai transaksi, tidak bisa dihapus", "danger"); return; } deleteCategory(id); showToast("Kategori dihapus", "danger"); }} />}
      {subView === "rekening" && <RekeningView wallets={data.wallets} transactions={data.transactions} onBack={() => setSubView(null)} onAdd={addWallet} onUpdate={updateWallet} onDelete={(id) => { if (data.transactions.some((t) => t.walletId === id)) { showToast("Rekening dipakai transaksi, tidak bisa dihapus", "danger"); return; } if (data.wallets.length <= 1) { showToast("Minimal harus ada 1 rekening", "danger"); return; } deleteWallet(id); showToast("Rekening dihapus", "danger"); }} />}
      {subView === "notifikasi" && <NotifikasiView notifSettings={data.notifSettings} budgets={data.budgets} categories={data.categories} transactions={data.transactions} onBack={() => setSubView(null)} onChange={setNotifSettings} />}
      {subView === "anggota" && <MembersView profiles={profiles} currentUser={currentUser} onBack={() => setSubView(null)} onSave={onSaveProfiles} onResetAll={() => setConfirmState({ open: true, title: "Atur ulang semua profil & data?", message: "Semua anggota dan seluruh data keuangan akan dihapus permanen.", onConfirm: () => { onLogout(); setConfirmState({ open: false }); } })} />}

      {!subView && (
        <>
          <div className="kk-screen">
            {activeTab === "dashboard" && <DashboardView data={data} currentUser={currentUser} onOpenWallets={() => setSubView("rekening")} onOpenTx={(tx) => { setEditingTx(tx); setShowAddModal(true); }} goTab={setActiveTab} />}
            {activeTab === "transaksi" && <TransaksiView data={data} profiles={profiles} onEdit={(tx) => { setEditingTx(tx); setShowAddModal(true); }} onDelete={(tx) => setConfirmState({ open: true, title: "Hapus transaksi ini?", message: `${tx.description || "Transaksi"} sebesar ${formatRupiah(tx.amount)} akan dihapus permanen.`, onConfirm: () => { deleteTransaction(tx.id); setConfirmState({ open: false }); } })} />}
            {activeTab === "laporan" && <LaporanView data={data} profiles={profiles} />}
            {activeTab === "budget" && <BudgetView data={data} onUpsert={upsertBudget} onDelete={(id) => setConfirmState({ open: true, title: "Hapus anggaran ini?", message: "Target anggaran untuk kategori ini akan dihapus.", onConfirm: () => { deleteBudget(id); setConfirmState({ open: false }); } })} />}
            {activeTab === "profil" && <ProfilView currentUser={currentUser} profiles={profiles} theme={theme} onToggleTheme={onToggleTheme} onOpenSub={setSubView} onLogout={onLogout} onExport={exportJSON} onImportClick={() => fileInputRef.current?.click()} onReset={() => setConfirmState({ open: true, title: "Reset semua data keuangan?", message: "Semua transaksi, kategori, rekening, dan anggaran akan dikembalikan ke kondisi awal. Profil anggota tidak terhapus.", onConfirm: () => { resetTransactionsOnly(); setConfirmState({ open: false }); } })} />}
          </div>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; }} />
          <button className="kk-fab" onClick={() => { setEditingTx(null); setShowAddModal(true); }} aria-label="Tambah transaksi"><Ic name="Plus" size={24} /></button>
          <BottomNav active={activeTab} onChange={setActiveTab} />
        </>
      )}

      {showAddModal && <TambahTransaksiModal categories={data.categories} wallets={data.wallets} editingTx={editingTx} onClose={() => { setShowAddModal(false); setEditingTx(null); }} onSave={(tx) => { upsertTransaction(tx); setShowAddModal(false); setEditingTx(null); }} />}
      <ConfirmDialog open={confirmState.open} title={confirmState.title} message={confirmState.message} onConfirm={confirmState.onConfirm} onCancel={() => setConfirmState({ open: false })} />
      {toast && <div className={`kk-toast tone-${toast.tone}`}>{toast.tone === "danger" ? <Ic name="Trash2" size={16} /> : <Ic name="Check" size={16} />}<span>{toast.msg}</span></div>}
    </>
  );
}

/* ============================= BOTTOM NAV ============================= */

  const items = [
    { key: "dashboard", label: "Dashboard", icon: "Home" },
    { key: "transaksi", label: "Transaksi", icon: "List" },
    { key: "laporan", label: "Laporan", icon: "PieIcon" },

      ); })}

}

/* ============================= DASHBOARD ============================= */

function DashboardView({ data, currentUser, onOpenWallets, onOpenTx, goTab }) {
  const { transactions, wallets, categories, budgets } = data;
  const totalSaldo = useMemo(() => wallets.reduce((s, w) => s + computeWalletBalance(w, transactions), 0), [wallets, transactions]);
  const now = new Date();
  const monthTx = useMemo(() => transactions.filter((t) => { const d = new Date(t.date + "T00:00:00"); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }), [transactions]);
  const pendapatanBulan = useMemo(() => monthTx.filter((t) => t.type === "pendapatan").reduce((s, t) => s + t.amount, 0), [monthTx]);
  const pengeluaranBulan = useMemo(() => monthTx.filter((t) => t.type === "pengeluaran").reduce((s, t) => s + t.amount, 0), [monthTx]);
  const sisaSaldo = pendapatanBulan - pengeluaranBulan;

  const trendData = useMemo(() => {
    const arr = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const inc = transactions.filter((t) => t.type === "pendapatan" && new Date(t.date + "T00:00:00").getFullYear() === d.getFullYear() && new Date(t.date + "T00:00:00").getMonth() === d.getMonth()).reduce((s, t) => s + t.amount, 0);
      const exp = transactions.filter((t) => t.type === "pengeluaran" && new Date(t.date + "T00:00:00").getFullYear() === d.getFullYear() && new Date(t.date + "T00:00:00").getMonth() === d.getMonth()).reduce((s, t) => s + t.amount, 0);
      arr.push({ label: MONTHS_SHORT_ID[d.getMonth()], Pendapatan: inc, Pengeluaran: exp });
    }
    return arr;
  }, [transactions]);

  const categoryBreakdown = useMemo(() => {
    const map = {};
    monthTx.filter((t) => t.type === "pengeluaran").forEach((t) => { map[t.categoryId] = (map[t.categoryId] || 0) + t.amount; });
    return Object.entries(map).map(([catId, val], i) => { const cat = categories.find((c) => c.id === catId); return { name: cat ? cat.name : "Lainnya", icon: cat ? cat.icon : "✳️", value: val, color: CHART_PALETTE[i % CHART_PALETTE.length] }; }).sort((a, b) => b.value - a.value);
  }, [monthTx, categories]);

  const recentTx = useMemo(() => [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date) || b.createdAt - a.createdAt).slice(0, 5), [transactions]);
  const budgetAlerts = useMemo(() => {
    const alerts = [];
    budgets.filter((b) => b.month === now.getMonth() && b.year === now.getFullYear()).forEach((b) => {
      const spent = monthTx.filter((t) => t.type === "pengeluaran" && t.categoryId === b.categoryId).reduce((s, t) => s + t.amount, 0);
      const pct = b.amount > 0 ? (spent / b.amount) * 100 : 0;
      if (pct >= 80) { const cat = categories.find((c) => c.id === b.categoryId); alerts.push({ name: cat?.name || "Kategori", pct }); }
    });
    return alerts;
  }, [budgets, monthTx, categories]);

  return (
    <div className="kk-page">
      <div className="kk-dash-header">
        <div><p className="kk-greeting">{greetingByHour()},</p><p className="kk-greeting-name">{currentUser.name} {currentUser.avatar}</p></div>
        <div className="kk-avatar-sm" style={{ background: currentUser.color + "22", color: currentUser.color }}>{currentUser.avatar}</div>
      </div>

      <div className="kk-balance-card">
        <div className="kk-balance-sparkline" aria-hidden="true">
          <svg viewBox="0 0 300 60" preserveAspectRatio="none" width="100%" height="60">
            <polyline fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2.5" points={trendData.map((d, i) => { const max = Math.max(...trendData.map((x) => x.Pendapatan), 1); const x = (i / (trendData.length - 1)) * 300; const y = 55 - (d.Pendapatan / max) * 45; return `${x},${y}`; }).join(" ")} />
          </svg>
        </div>
        <p className="kk-balance-label">Saldo Kas Keluarga</p>
        <p className="kk-balance-value">{formatRupiah(totalSaldo)}</p>
        <button className="kk-wallets-link" onClick={onOpenWallets}><Ic name="Wallet" size={13} /> {wallets.length} rekening <Ic name="ChevronRight" size={13} /></button>
      </div>

      <div className="kk-kpi-row">
        <div className="kk-kpi-card income"><div className="kk-kpi-icon"><Ic name="ArrowUpRight" size={16} /></div><p className="kk-kpi-label">Pendapatan</p><p className="kk-kpi-value">{formatRupiah(pendapatanBulan)}</p></div>
        <div className="kk-kpi-card expense"><div className="kk-kpi-icon"><Ic name="ArrowDownRight" size={16} /></div><p className="kk-kpi-label">Pengeluaran</p><p className="kk-kpi-value">{formatRupiah(pengeluaranBulan)}</p></div>
      </div>
      <div className="kk-kpi-card full"><p className="kk-kpi-label">Sisa Saldo Bulan Ini</p><p className={`kk-kpi-value ${sisaSaldo < 0 ? "neg" : ""}`}>{formatRupiah(sisaSaldo)}</p></div>

      {budgetAlerts.length > 0 && <div className="kk-alert-banner" onClick={() => goTab("budget")}><Ic name="AlertTriangle" size={16} /><span>{budgetAlerts.length} anggaran hampir/sudah habis bulan ini. Ketuk untuk lihat.</span></div>}

      <div className="kk-card">
        <p className="kk-card-title">Grafik Keuangan</p>
        <p className="kk-card-sub">Pendapatan vs Pengeluaran, 6 bulan terakhir</p>
        <BarChartSVG data={trendData} series={[{ key: "Pendapatan", color: "var(--kk-success)" }, { key: "Pengeluaran", color: "var(--kk-danger)" }]} height={180} />
        <div className="kk-legend-row"><span className="kk-legend-item"><i style={{ background: "var(--kk-success)" }} />Pendapatan</span><span className="kk-legend-item"><i style={{ background: "var(--kk-danger)" }} />Pengeluaran</span></div>
      </div>

      <div className="kk-card">
        <p className="kk-card-title">Pengeluaran Bulan Ini</p>
        {categoryBreakdown.length === 0 ? <EmptyState icon="📊" title="Belum ada pengeluaran" subtitle="Catat transaksi untuk melihat grafik kategori." /> : (
          <>
            <div style={{ display: "flex", justifyContent: "center", padding: "6px 0" }}><DonutChartSVG data={categoryBreakdown} /></div>
            <div className="kk-cat-list">{categoryBreakdown.slice(0, 5).map((c, i) => <div key={i} className="kk-cat-row"><span className="kk-cat-dot" style={{ background: c.color }} /><span className="kk-cat-name">{c.icon} {c.name}</span><span className="kk-cat-val">{formatRupiah(c.value)}</span></div>)}</div>
          </>
        )}
      </div>

      <div className="kk-card">
        <div className="kk-card-header-row"><p className="kk-card-title" style={{ marginBottom: 0 }}>Transaksi Terbaru</p><button className="kk-link-btn" onClick={() => goTab("transaksi")}>Lihat semua</button></div>
        {recentTx.length === 0 ? <EmptyState icon="🧾" title="Belum ada transaksi" subtitle="Ketuk tombol + untuk mencatat transaksi pertama." /> : (
          <div className="kk-tx-list">{recentTx.map((t) => { const cat = categories.find((c) => c.id === t.categoryId); return (
            <button key={t.id} className="kk-tx-row" onClick={() => onOpenTx(t)}>
              <span className="kk-tx-icon">{cat?.icon || "✳️"}</span>
              <span className="kk-tx-mid"><span className="kk-tx-desc">{t.description || cat?.name || "Transaksi"}</span><span className="kk-tx-date">{formatDateShort(t.date)} · oleh {t.enteredByName || "?"}</span></span>
              <span className={`kk-tx-amt ${t.type === "pendapatan" ? "pos" : "neg"}`}>{t.type === "pendapatan" ? "+" : "-"} {formatRupiah(t.amount)}</span>
            </button>
          ); })}</div>
        )}
      </div>
      <div style={{ height: 90 }} />
    </div>
  );
}

/* ============================= TRANSAKSI ============================= */

function TransaksiView({ data, profiles, onEdit, onDelete }) {
  const { transactions, categories, wallets } = data;
  const [search, setSearch] = useState("");
  const [showFilter, setShowFilter] = useState(false);
  const [filterType, setFilterType] = useState("all");
  const [filterCategory, setFilterCategory] = useState("all");
  const [filterMember, setFilterMember] = useState("all");
  const [filterStart, setFilterStart] = useState("");
  const [filterEnd, setFilterEnd] = useState("");
  const [sortDir, setSortDir] = useState("desc");
  const [visibleCount, setVisibleCount] = useState(15);

  const filtered = useMemo(() => {
    let arr = [...transactions];
    if (search.trim()) { const q = search.trim().toLowerCase(); arr = arr.filter((t) => (t.description || "").toLowerCase().includes(q) || (t.note || "").toLowerCase().includes(q)); }
    if (filterType !== "all") arr = arr.filter((t) => t.type === filterType);
    if (filterCategory !== "all") arr = arr.filter((t) => t.categoryId === filterCategory);
    if (filterMember !== "all") arr = arr.filter((t) => t.enteredById === filterMember);
    if (filterStart) arr = arr.filter((t) => t.date >= filterStart);
    if (filterEnd) arr = arr.filter((t) => t.date <= filterEnd);
    arr.sort((a, b) => sortDir === "desc" ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));
    return arr;
  }, [transactions, search, filterType, filterCategory, filterMember, filterStart, filterEnd, sortDir]);

  const visible = filtered.slice(0, visibleCount);
  const activeFilterCount = (filterType !== "all" ? 1 : 0) + (filterCategory !== "all" ? 1 : 0) + (filterMember !== "all" ? 1 : 0) + (filterStart || filterEnd ? 1 : 0);
  const grouped = useMemo(() => { const groups = {}; visible.forEach((t) => { if (!groups[t.date]) groups[t.date] = []; groups[t.date].push(t); }); return Object.entries(groups); }, [visible]);

  return (
    <div className="kk-page">
      <p className="kk-page-title">Transaksi</p>
      <div className="kk-search-row">
        <div className="kk-search-box"><Ic name="Search" size={16} /><input placeholder="Cari transaksi..." value={search} onChange={(e) => { setSearch(e.target.value); setVisibleCount(15); }} />{search && <button onClick={() => setSearch("")}><Ic name="X" size={14} /></button>}</div>
        <button className={`kk-filter-btn ${activeFilterCount > 0 ? "active" : ""}`} onClick={() => setShowFilter(true)}><Ic name="SlidersHorizontal" size={16} />{activeFilterCount > 0 && <span className="kk-filter-badge">{activeFilterCount}</span>}</button>
      </div>
      <div className="kk-chip-row">
        {["all", "pendapatan", "pengeluaran"].map((t) => <button key={t} className={`kk-chip ${filterType === t ? "active" : ""}`} onClick={() => setFilterType(t)}>{t === "all" ? "Semua" : t === "pendapatan" ? "Pendapatan" : "Pengeluaran"}</button>)}
        <button className="kk-chip sort" onClick={() => setSortDir((s) => (s === "desc" ? "asc" : "desc"))}>{sortDir === "desc" ? "Terbaru" : "Terlama"} <Ic name={sortDir === "desc" ? "ChevronDown" : "ChevronUp"} size={13} /></button>
      </div>
      {grouped.length === 0 ? <EmptyState icon="🔍" title="Tidak ada transaksi" subtitle="Coba ubah kata kunci pencarian atau filter." /> : (
        <>
          {grouped.map(([date, items]) => (
            <div key={date} className="kk-tx-group">
              <p className="kk-tx-group-date">{formatDateID(date, true)}</p>
              <div className="kk-card no-pad">
                {items.map((t) => { const cat = categories.find((c) => c.id === t.categoryId); const wal = wallets.find((w) => w.id === t.walletId); return (
                  <div key={t.id} className="kk-tx-row-full">
                    <button className="kk-tx-row-clickable" onClick={() => onEdit(t)}>
                      <span className="kk-tx-icon">{cat?.icon || "✳️"}</span>
                      <span className="kk-tx-mid"><span className="kk-tx-desc">{t.description || cat?.name || "Transaksi"}</span><span className="kk-tx-date">{cat?.name} · {wal?.name || "-"} · oleh {t.enteredByName || "?"}</span></span>
                      <span className={`kk-tx-amt ${t.type === "pendapatan" ? "pos" : "neg"}`}>{t.type === "pendapatan" ? "+" : "-"} {formatRupiah(t.amount)}</span>
                    </button>
                    <div className="kk-tx-actions"><button className="kk-icon-btn xs" onClick={() => onEdit(t)}><Ic name="Edit2" size={14} /></button><button className="kk-icon-btn xs danger" onClick={() => onDelete(t)}><Ic name="Trash2" size={14} /></button></div>
                  </div>
                ); })}
              </div>
            </div>
          ))}
          {visibleCount < filtered.length && <button className="kk-btn secondary full" onClick={() => setVisibleCount((v) => v + 15)}>Muat lebih banyak ({filtered.length - visibleCount})</button>}
        </>
      )}
      <div style={{ height: 90 }} />
      {showFilter && (
        <div className="kk-overlay" onClick={() => setShowFilter(false)}>
          <div className="kk-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="kk-sheet-handle" />
            <p className="kk-sheet-title">Filter Transaksi</p>
            <p className="kk-field-label">Kategori</p>
            <select className="kk-select" value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}><option value="all">Semua kategori</option>{categories.map((c) => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</select>
            <p className="kk-field-label">Dicatat oleh</p>
            <select className="kk-select" value={filterMember} onChange={(e) => setFilterMember(e.target.value)}><option value="all">Semua anggota</option>{profiles.map((p) => <option key={p.id} value={p.id}>{p.avatar} {p.name}</option>)}</select>
            <p className="kk-field-label">Rentang tanggal</p>
            <div className="kk-row-2"><input type="date" className="kk-input" value={filterStart} onChange={(e) => setFilterStart(e.target.value)} /><input type="date" className="kk-input" value={filterEnd} onChange={(e) => setFilterEnd(e.target.value)} /></div>
            <div className="kk-sheet-actions"><button className="kk-btn ghost" onClick={() => { setFilterCategory("all"); setFilterMember("all"); setFilterStart(""); setFilterEnd(""); }}>Reset</button><button className="kk-btn primary" onClick={() => setShowFilter(false)}>Terapkan</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================= TAMBAH / EDIT TRANSAKSI ============================= */

function TambahTransaksiModal({ categories, wallets, editingTx, onClose, onSave }) {
  const [type, setType] = useState(editingTx?.type || "pengeluaran");
  const [amountStr, setAmountStr] = useState(editingTx ? formatWithThousands(editingTx.amount) : "");
  const [categoryId, setCategoryId] = useState(editingTx?.categoryId || "");
  const [walletId, setWalletId] = useState(editingTx?.walletId || wallets[0]?.id || "");
  const [date, setDate] = useState(editingTx?.date || todayISO());
  const [description, setDescription] = useState(editingTx?.description || "");
  const [paymentMethod, setPaymentMethod] = useState(editingTx?.paymentMethod || PAYMENT_METHODS[0]);
  const [note, setNote] = useState(editingTx?.note || "");
  const [receiptImage, setReceiptImage] = useState(editingTx?.receiptImage || null);
  const [errors, setErrors] = useState({});
  const fileRef = useRef(null);
  const filteredCategories = categories.filter((c) => c.type === type);
  useEffect(() => { if (categoryId && !filteredCategories.some((c) => c.id === categoryId)) setCategoryId(""); }, [type]);
  const handleFile = (file) => {
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { setErrors((e) => ({ ...e, receipt: "Ukuran gambar maksimal 3MB" })); return; }
    const reader = new FileReader(); reader.onload = (e) => setReceiptImage(e.target.result); reader.readAsDataURL(file);
    setErrors((e) => ({ ...e, receipt: undefined }));
  };
  const validate = () => {
    const errs = {}; const amount = parseDigits(amountStr);
    if (!amount || amount <= 0) errs.amount = "Nominal wajib diisi";
    if (!type) errs.type = "Jenis transaksi wajib dipilih";
    if (!categoryId) errs.category = "Kategori wajib dipilih";
    if (!date) errs.date = "Tanggal wajib diisi";
    if (!walletId) errs.wallet = "Pilih rekening/dompet";
    setErrors(errs); return Object.keys(errs).length === 0;
  };
  const handleSubmit = () => { if (!validate()) return; onSave({ id: editingTx?.id || uid("tx"), type, amount: parseDigits(amountStr), categoryId, walletId, date, description: description.trim(), paymentMethod, note: note.trim(), receiptImage }); };

  return (
    <div className="kk-overlay">
      <div className="kk-fullsheet">
        <TopBar title={editingTx ? "Edit Transaksi" : "Tambah Transaksi"} onBack={onClose} />
        <div className="kk-form-scroll">
          <p className="kk-field-label">Jenis transaksi</p>
          <div className="kk-segmented">
            <button className={`kk-seg-btn ${type === "pendapatan" ? "active income" : ""}`} onClick={() => setType("pendapatan")}><Ic name="ArrowUpRight" size={15} /> Pendapatan</button>
            <button className={`kk-seg-btn ${type === "pengeluaran" ? "active expense" : ""}`} onClick={() => setType("pengeluaran")}><Ic name="ArrowDownRight" size={15} /> Pengeluaran</button>
          </div>
          {errors.type && <p className="kk-error">{errors.type}</p>}
          <p className="kk-field-label">Nominal</p>
          <div className={`kk-amount-input ${errors.amount ? "err" : ""}`}><span>Rp</span><input inputMode="numeric" placeholder="0" value={amountStr} onChange={(e) => setAmountStr(formatWithThousands(parseDigits(e.target.value)))} /></div>
          {errors.amount && <p className="kk-error">{errors.amount}</p>}
          <p className="kk-field-label">Kategori</p>
          <div className="kk-cat-grid">{filteredCategories.map((c) => <button key={c.id} className={`kk-cat-chip ${categoryId === c.id ? "active" : ""}`} onClick={() => setCategoryId(c.id)}><span className="kk-cat-chip-icon">{c.icon}</span><span>{c.name}</span></button>)}</div>
          {errors.category && <p className="kk-error">{errors.category}</p>}
          <p className="kk-field-label">Tanggal</p>
          <input type="date" className={`kk-input ${errors.date ? "err" : ""}`} value={date} onChange={(e) => setDate(e.target.value)} max={todayISO()} />
          {errors.date && <p className="kk-error">{errors.date}</p>}
          <p className="kk-field-label">Deskripsi</p>
          <input className="kk-input" placeholder="Contoh: Makan siang di kantor" value={description} onChange={(e) => setDescription(e.target.value)} />
          <p className="kk-field-label">Rekening / Dompet</p>
          <select className={`kk-select ${errors.wallet ? "err" : ""}`} value={walletId} onChange={(e) => setWalletId(e.target.value)}>{wallets.map((w) => <option key={w.id} value={w.id}>{w.icon} {w.name}</option>)}</select>
          {errors.wallet && <p className="kk-error">{errors.wallet}</p>}
          <p className="kk-field-label">Metode pembayaran</p>
          <select className="kk-select" value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)}>{PAYMENT_METHODS.map((m) => <option key={m} value={m}>{m}</option>)}</select>
          <p className="kk-field-label">Catatan</p>
          <textarea className="kk-textarea" rows={3} placeholder="Catatan tambahan (opsional)" value={note} onChange={(e) => setNote(e.target.value)} />
          <p className="kk-field-label">Lampiran bukti</p>
          {receiptImage ? (<div className="kk-receipt-preview"><img src={receiptImage} alt="Bukti transaksi" /><button className="kk-receipt-remove" onClick={() => setReceiptImage(null)}><Ic name="X" size={14} /></button></div>) : (<button className="kk-upload-box" onClick={() => fileRef.current?.click()}><Ic name="Camera" size={20} /><span>Unggah foto bukti</span></button>)}
          {errors.receipt && <p className="kk-error">{errors.receipt}</p>}
          <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={(e) => handleFile(e.target.files[0])} />
          <div style={{ height: 90 }} />
        </div>
        <div className="kk-form-footer"><button className="kk-btn primary full" onClick={handleSubmit}>Simpan Transaksi</button></div>
      </div>
    </div>
  );
}
