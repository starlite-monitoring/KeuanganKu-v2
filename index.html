function LaporanView({ data, profiles }) {
  const { transactions, categories } = data;
  const [period, setPeriod] = useState("month");
  const [customRange, setCustomRange] = useState({ start: "", end: "" });
  const [showExport, setShowExport] = useState(false);
  const filtered = useMemo(() => transactions.filter((t) => isInPeriod(t.date, period, customRange)), [transactions, period, customRange]);
  const totalPendapatan = filtered.filter((t) => t.type === "pendapatan").reduce((s, t) => s + t.amount, 0);
  const totalPengeluaran = filtered.filter((t) => t.type === "pengeluaran").reduce((s, t) => s + t.amount, 0);
  const selisih = totalPendapatan - totalPengeluaran;
  const pctPengeluaran = totalPendapatan > 0 ? Math.min((totalPengeluaran / totalPendapatan) * 100, 999) : (totalPengeluaran > 0 ? 100 : 0);
  const dailySeries = useMemo(() => { const map = {}; filtered.forEach((t) => { if (!map[t.date]) map[t.date] = { date: t.date, Pendapatan: 0, Pengeluaran: 0 }; map[t.date][t.type === "pendapatan" ? "Pendapatan" : "Pengeluaran"] += t.amount; }); return Object.values(map).sort((a, b) => new Date(a.date) - new Date(b.date)).map((d) => ({ ...d, label: formatDateShort(d.date).slice(0, 6) })); }, [filtered]);
  const categoryBreakdown = useMemo(() => { const map = {}; filtered.filter((t) => t.type === "pengeluaran").forEach((t) => { map[t.categoryId] = (map[t.categoryId] || 0) + t.amount; }); return Object.entries(map).map(([catId, val], i) => { const cat = categories.find((c) => c.id === catId); return { name: cat?.name || "Lainnya", icon: cat?.icon || "✳️", value: val, color: CHART_PALETTE[i % CHART_PALETTE.length] }; }).sort((a, b) => b.value - a.value); }, [filtered, categories]);
  const memberBreakdown = useMemo(() => { const map = {}; filtered.forEach((t) => { const key = t.enteredByName || "?"; if (!map[key]) map[key] = 0; map[key] += t.type === "pengeluaran" ? t.amount : 0; }); return Object.entries(map).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]); }, [filtered]);
  const top5 = categoryBreakdown.slice(0, 5);
  const periodLabel = { today: "Hari ini", week: "Minggu ini", month: "Bulan ini", year: "Tahun ini", custom: "Custom" }[period];

  const exportCSV = () => {
    const header = ["Tanggal", "Jenis", "Kategori", "Deskripsi", "Nominal", "Metode Pembayaran", "Dicatat Oleh", "Catatan"];
    const rows = filtered.map((t) => { const cat = categories.find((c) => c.id === t.categoryId); return [t.date, t.type, cat?.name || "", t.description || "", t.amount, t.paymentMethod || "", t.enteredByName || "", (t.note || "").replace(/\n/g, " ")]; });
    const csv = [header, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
    downloadBlob("\uFEFF" + csv, `laporan-keuanganku-${periodLabel.replace(/\s/g, "-")}.csv`, "text/csv;charset=utf-8");
    setShowExport(false);
  };
  const exportExcel = () => {
    try {
      const rows = filtered.map((t) => { const cat = categories.find((c) => c.id === t.categoryId); return { Tanggal: formatDateID(t.date), Jenis: t.type === "pendapatan" ? "Pendapatan" : "Pengeluaran", Kategori: cat?.name || "", Deskripsi: t.description || "", Nominal: t.amount, "Metode Pembayaran": t.paymentMethod || "", "Dicatat Oleh": t.enteredByName || "", Catatan: t.note || "" }; });
      const ws = window.XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [{ wch: 14 }, { wch: 12 }, { wch: 16 }, { wch: 26 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 24 }];
      const wb = window.XLSX.utils.book_new();
      window.XLSX.utils.book_append_sheet(wb, ws, "Laporan");
      window.XLSX.writeFile(wb, `laporan-keuanganku-${periodLabel.replace(/\s/g, "-")}.xlsx`);
    } catch (e) { console.error(e); }
    setShowExport(false);
  };
  const exportPDF = () => { setShowExport(false); setTimeout(() => window.print(), 200); };

  return (
    <div className="kk-page">
      <p className="kk-page-title">Laporan</p>
      <div className="kk-chip-row">{[["today", "Hari ini"], ["week", "Minggu ini"], ["month", "Bulan ini"], ["year", "Tahun ini"], ["custom", "Custom"]].map(([k, l]) => <button key={k} className={`kk-chip ${period === k ? "active" : ""}`} onClick={() => setPeriod(k)}>{l}</button>)}</div>
      {period === "custom" && <div className="kk-row-2" style={{ marginTop: 10 }}><input type="date" className="kk-input" value={customRange.start} onChange={(e) => setCustomRange((r) => ({ ...r, start: e.target.value }))} /><input type="date" className="kk-input" value={customRange.end} onChange={(e) => setCustomRange((r) => ({ ...r, end: e.target.value }))} /></div>}
      <div className="kk-kpi-row" style={{ marginTop: 14 }}>
        <div className="kk-kpi-card income"><p className="kk-kpi-label">Total Pendapatan</p><p className="kk-kpi-value">{formatRupiah(totalPendapatan)}</p></div>
        <div className="kk-kpi-card expense"><p className="kk-kpi-label">Total Pengeluaran</p><p className="kk-kpi-value">{formatRupiah(totalPengeluaran)}</p></div>
      </div>
      <div className="kk-kpi-row">
        <div className="kk-kpi-card full"><p className="kk-kpi-label">Selisih</p><p className={`kk-kpi-value ${selisih < 0 ? "neg" : ""}`}>{formatRupiah(selisih)}</p></div>
        <div className="kk-kpi-card full"><p className="kk-kpi-label">% Pengeluaran</p><p className="kk-kpi-value">{pctPengeluaran.toFixed(0)}%</p></div>
      </div>
      <div className="kk-card">
        <p className="kk-card-title">Tren Harian</p>
        {dailySeries.length === 0 ? <EmptyState icon="📈" title="Belum ada data" /> : <LineChartSVG data={dailySeries} series={[{ key: "Pendapatan", color: "var(--kk-success)" }, { key: "Pengeluaran", color: "var(--kk-danger)" }]} height={170} />}
        <div className="kk-legend-row"><span className="kk-legend-item"><i style={{ background: "var(--kk-success)" }} />Pendapatan</span><span className="kk-legend-item"><i style={{ background: "var(--kk-danger)" }} />Pengeluaran</span></div>
      </div>
      <div className="kk-card">
        <p className="kk-card-title">Pengeluaran per Kategori</p>
        {categoryBreakdown.length === 0 ? <EmptyState icon="📊" title="Belum ada pengeluaran" /> : <div style={{ display: "flex", justifyContent: "center", padding: "6px 0" }}><DonutChartSVG data={categoryBreakdown} /></div>}
      </div>
      <div className="kk-card">
        <p className="kk-card-title">Top 5 Kategori Pengeluaran</p>
        {top5.length === 0 ? <EmptyState icon="🏆" title="Belum ada data" /> : <div className="kk-cat-list">{top5.map((c, i) => <div key={i} className="kk-cat-row"><span className="kk-rank">{i + 1}</span><span className="kk-cat-name">{c.icon} {c.name}</span><span className="kk-cat-val">{formatRupiah(c.value)}</span></div>)}</div>}
      </div>
      <div className="kk-card">
        <p className="kk-card-title">Pengeluaran per Anggota</p>
        {memberBreakdown.length === 0 ? <EmptyState icon="👥" title="Belum ada data" /> : <div className="kk-cat-list">{memberBreakdown.map(([name, val], i) => { const p = profiles.find((pr) => pr.name === name); return <div key={i} className="kk-cat-row"><span className="kk-cat-dot" style={{ background: p?.color || "var(--kk-primary)" }} /><span className="kk-cat-name">{p?.avatar || "👤"} {name}</span><span className="kk-cat-val">{formatRupiah(val)}</span></div>; })}</div>}
      </div>
      <button className="kk-btn primary full" onClick={() => setShowExport(true)}><Ic name="Download" size={16} /> Export Laporan</button>
      <div style={{ height: 90 }} />
      {showExport && (
        <div className="kk-overlay" onClick={() => setShowExport(false)}>
          <div className="kk-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="kk-sheet-handle" />
            <p className="kk-sheet-title">Export Laporan ({periodLabel})</p>
            <button className="kk-export-opt" onClick={exportExcel}><Ic name="FileSpreadsheet" size={18} /> <span>Excel (.xlsx)</span><Ic name="ChevronRight" size={16} /></button>
            <button className="kk-export-opt" onClick={exportPDF}><Ic name="FileDown" size={18} /> <span>PDF (cetak / simpan)</span><Ic name="ChevronRight" size={16} /></button>
            <button className="kk-export-opt" onClick={exportCSV}><Ic name="FileText" size={18} /> <span>CSV</span><Ic name="ChevronRight" size={16} /></button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================= BUDGET ============================= */

function BudgetView({ data, onUpsert, onDelete }) {
  const { budgets, categories, transactions } = data;
  const now = new Date();
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [categoryId, setCategoryId] = useState("");
  const [amount, setAmount] = useState("");
  const expenseCats = categories.filter((c) => c.type === "pengeluaran");
  const monthBudgets = budgets.filter((b) => b.month === now.getMonth() && b.year === now.getFullYear());
  const usedCatIds = new Set(monthBudgets.map((b) => b.categoryId));
  const availableCats = expenseCats.filter((c) => !usedCatIds.has(c.id) || editing?.categoryId === c.id);
  const monthTx = transactions.filter((t) => { const d = new Date(t.date + "T00:00:00"); return t.type === "pengeluaran" && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); });
  const totalBudget = monthBudgets.reduce((s, b) => s + b.amount, 0);
  const totalSpent = monthBudgets.reduce((s, b) => s + monthTx.filter((t) => t.categoryId === b.categoryId).reduce((ss, t) => ss + t.amount, 0), 0);
  const openNew = () => { setEditing(null); setCategoryId(""); setAmount(""); setShowForm(true); };
  const openEdit = (b) => { setEditing(b); setCategoryId(b.categoryId); setAmount(formatWithThousands(b.amount)); setShowForm(true); };
  const save = () => { const amt = parseDigits(amount); if (!categoryId || amt <= 0) return; onUpsert({ id: editing?.id || uid("bud"), categoryId, month: now.getMonth(), year: now.getFullYear(), amount: amt }); setShowForm(false); };

  return (
    <div className="kk-page">
      <div className="kk-card-header-row"><p className="kk-page-title" style={{ marginBottom: 0 }}>Anggaran · {MONTHS_ID[now.getMonth()]} {now.getFullYear()}</p><button className="kk-icon-btn" onClick={openNew}><Ic name="Plus" size={20} /></button></div>
      <div className="kk-card">
        <p className="kk-card-sub">Total anggaran bulan ini</p>
        <div className="kk-row-2" style={{ marginTop: 6 }}><div><p className="kk-kpi-label">Budget</p><p className="kk-kpi-value" style={{ fontSize: 18 }}>{formatRupiah(totalBudget)}</p></div><div><p className="kk-kpi-label">Terpakai</p><p className="kk-kpi-value" style={{ fontSize: 18 }}>{formatRupiah(totalSpent)}</p></div></div>
        <ProgressBar percent={totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0} tone={totalBudget > 0 && totalSpent / totalBudget >= 1 ? "danger" : totalBudget > 0 && totalSpent / totalBudget >= 0.8 ? "warning" : "primary"} />
      </div>
      {monthBudgets.length === 0 ? <EmptyState icon="🎯" title="Belum ada anggaran" subtitle="Tambahkan target anggaran bulanan per kategori." /> : monthBudgets.map((b) => {
        const cat = categories.find((c) => c.id === b.categoryId);
        const spent = monthTx.filter((t) => t.categoryId === b.categoryId).reduce((s, t) => s + t.amount, 0);
        const pct = b.amount > 0 ? (spent / b.amount) * 100 : 0;
        const sisa = b.amount - spent;
        const tone = pct >= 100 ? "danger" : pct >= 80 ? "warning" : "primary";
        const statusLabel = pct >= 100 ? "Over budget" : pct >= 80 ? "Hampir habis" : null;
        return (
          <div key={b.id} className="kk-card">
            <div className="kk-card-header-row"><span className="kk-tx-desc">{cat?.icon} {cat?.name || "Kategori"}</span><div className="kk-tx-actions"><button className="kk-icon-btn xs" onClick={() => openEdit(b)}><Ic name="Edit2" size={14} /></button><button className="kk-icon-btn xs danger" onClick={() => onDelete(b.id)}><Ic name="Trash2" size={14} /></button></div></div>
            <div className="kk-row-2" style={{ marginTop: 8, marginBottom: 6 }}><span className="kk-tx-date">{formatRupiah(spent)} dari {formatRupiah(b.amount)}</span><span className={`kk-budget-pct tone-${tone}`}>{pct.toFixed(0)}%</span></div>
            <ProgressBar percent={pct} tone={tone} />
            <div className="kk-row-2" style={{ marginTop: 8 }}><span className="kk-tx-date">Sisa: {formatRupiah(Math.max(sisa, 0))}</span>{statusLabel && <span className={`kk-status-pill tone-${tone}`}><Ic name="AlertTriangle" size={11} /> {statusLabel}</span>}</div>
          </div>
        );
      })}
      <div style={{ height: 90 }} />
      {showForm && (
        <div className="kk-overlay" onClick={() => setShowForm(false)}>
          <div className="kk-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="kk-sheet-handle" />
            <p className="kk-sheet-title">{editing ? "Edit Anggaran" : "Tambah Anggaran"}</p>
            <p className="kk-field-label">Kategori</p>
            <select className="kk-select" value={categoryId} onChange={(e) => setCategoryId(e.target.value)}><option value="">Pilih kategori</option>{availableCats.map((c) => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</select>
            <p className="kk-field-label">Jumlah anggaran per bulan</p>
            <div className="kk-amount-input"><span>Rp</span><input inputMode="numeric" placeholder="0" value={amount} onChange={(e) => setAmount(formatWithThousands(parseDigits(e.target.value)))} /></div>
            <div className="kk-sheet-actions"><button className="kk-btn ghost" onClick={() => setShowForm(false)}>Batal</button><button className="kk-btn primary" onClick={save}>Simpan</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================= NOTIFIKASI ============================= */

function NotifikasiView({ notifSettings, budgets, categories, transactions, onBack, onChange }) {
  const now = new Date();
  const todayTx = transactions.some((t) => t.date === todayISO());
  const monthTx = transactions.filter((t) => { const d = new Date(t.date + "T00:00:00"); return t.type === "pengeluaran" && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); });
  const reminders = [];
  if (notifSettings.notifCatat && !todayTx) reminders.push({ icon: "📝", text: "Belum ada transaksi yang dicatat hari ini. Yuk catat sebelum lupa." });
  if (notifSettings.notifBudget) budgets.filter((b) => b.month === now.getMonth() && b.year === now.getFullYear()).forEach((b) => {
    const cat = categories.find((c) => c.id === b.categoryId);
    const spent = monthTx.filter((t) => t.categoryId === b.categoryId).reduce((s, t) => s + t.amount, 0);
    const pct = b.amount > 0 ? (spent / b.amount) * 100 : 0;
    if (pct >= 100) reminders.push({ icon: "🚨", text: `Anggaran ${cat?.name} sudah over budget (${pct.toFixed(0)}%).` });
    else if (pct >= 80) reminders.push({ icon: "⚠️", text: `Anggaran ${cat?.name} sudah terpakai ${pct.toFixed(0)}%.` });
  });
  if (notifSettings.notifTagihan) {
    const cicilanCat = categories.find((c) => c.name.toLowerCase().includes("cicilan"));
    const tagihanCat = categories.find((c) => c.name.toLowerCase().includes("tagihan"));
    [cicilanCat, tagihanCat].filter(Boolean).forEach((cat) => { const paid = transactions.some((t) => t.categoryId === cat.id && new Date(t.date + "T00:00:00").getMonth() === now.getMonth() && new Date(t.date + "T00:00:00").getFullYear() === now.getFullYear()); if (!paid) reminders.push({ icon: "📅", text: `Belum ada catatan pembayaran untuk ${cat.name} bulan ini.` }); });
  }
  if (notifSettings.notifRingkasan) {
    const income = transactions.filter((t) => t.type === "pendapatan" && new Date(t.date + "T00:00:00").getMonth() === now.getMonth() && new Date(t.date + "T00:00:00").getFullYear() === now.getFullYear()).reduce((s, t) => s + t.amount, 0);
    const expense = monthTx.reduce((s, t) => s + t.amount, 0);
    reminders.push({ icon: "📊", text: `Ringkasan bulan ini: pendapatan ${formatRupiah(income)}, pengeluaran ${formatRupiah(expense)}.` });
  }
  return (
    <div className="kk-page">
      <TopBar title="Notifikasi" onBack={onBack} />
      <div className="kk-page-body">
        <p className="kk-info-note">Pengaturan ini berlaku untuk semua anggota keluarga.</p>
        <div className="kk-card no-pad">
          <div className="kk-setting-row"><span>Pengingat mencatat transaksi</span><Toggle checked={notifSettings.notifCatat} onChange={(v) => onChange({ notifCatat: v })} /></div>
          <div className="kk-setting-row"><span>Pengingat budget hampir habis</span><Toggle checked={notifSettings.notifBudget} onChange={(v) => onChange({ notifBudget: v })} /></div>
          <div className="kk-setting-row"><span>Pengingat tagihan</span><Toggle checked={notifSettings.notifTagihan} onChange={(v) => onChange({ notifTagihan: v })} /></div>
          <div className="kk-setting-row"><span>Ringkasan keuangan bulanan</span><Toggle checked={notifSettings.notifRingkasan} onChange={(v) => onChange({ notifRingkasan: v })} /></div>
        </div>
        <p className="kk-section-label">Notifikasi saat ini</p>
        {reminders.length === 0 ? <EmptyState icon="🔕" title="Tidak ada notifikasi" subtitle="Aktifkan pengingat di atas untuk mendapat notifikasi." /> : <div className="kk-card no-pad">{reminders.map((r, i) => <div key={i} className="kk-notif-row"><span className="kk-notif-icon">{r.icon}</span><span className="kk-notif-text">{r.text}</span></div>)}</div>}
      </div>
    </div>
  );
}

/* ============================= PROFIL ============================= */

  return (
    <div className="kk-page">
      <p className="kk-page-title">Profil</p>
      <div className="kk-profile-header">
        <div className="kk-avatar-lg" style={{ background: currentUser.color + "22", color: currentUser.color }}>{currentUser.avatar}</div>
        <div style={{ flex: 1 }}><p className="kk-wallet-name">{currentUser.name}</p><p className="kk-wallet-type">Anggota kas keluarga</p></div>
        <button className="kk-logout-btn" onClick={onLogout}><Ic name="LogOut" size={14} /> Keluar</button>
      </div>
      <p className="kk-section-label">Keluarga</p>
      <div className="kk-card no-pad"><button className="kk-menu-row" onClick={() => onOpenSub("anggota")}><span className="kk-menu-icon"><Ic name="Users" size={16} /></span><span>Kelola Anggota</span><Ic name="ChevronRight" size={16} /></button></div>
      <p className="kk-section-label">Data & Kategori</p>
      <div className="kk-card no-pad">
        <button className="kk-menu-row" onClick={() => onOpenSub("kategori")}><span className="kk-menu-icon">🏷️</span><span>Kategori</span><Ic name="ChevronRight" size={16} /></button>
        <button className="kk-menu-row" onClick={() => onOpenSub("rekening")}><span className="kk-menu-icon">💳</span><span>Rekening / Dompet</span><Ic name="ChevronRight" size={16} /></button>
        <button className="kk-menu-row" onClick={() => onOpenSub("notifikasi")}><span className="kk-menu-icon">🔔</span><span>Notifikasi</span><Ic name="ChevronRight" size={16} /></button>
      </div>
      <p className="kk-section-label">Tampilan</p>
      <div className="kk-card no-pad"><div className="kk-setting-row"><span className="kk-menu-row-label"><Ic name="Sun" size={16} /> Tema Terang / Gelap</span><button className="kk-theme-switch" onClick={onToggleTheme}><Ic name={theme === "dark" ? "Moon" : "Sun"} size={14} /><span>{theme === "dark" ? "Gelap" : "Terang"}</span></button></div></div>
      <p className="kk-section-label">Data</p>
      <div className="kk-card no-pad">
        <button className="kk-menu-row" onClick={onExport}><span className="kk-menu-icon"><Ic name="Download" size={16} /></span><span>Backup / Export Data</span><Ic name="ChevronRight" size={16} /></button>
        <button className="kk-menu-row" onClick={onImportClick}><span className="kk-menu-icon"><Ic name="Upload" size={16} /></span><span>Import Data</span><Ic name="ChevronRight" size={16} /></button>
        <button className="kk-menu-row danger" onClick={onReset}><span className="kk-menu-icon"><Ic name="RefreshCw" size={16} /></span><span>Reset Data Keuangan</span><Ic name="ChevronRight" size={16} /></button>
      </div>
      <p className="kk-app-version">KeuanganKu · Kas Bersama · {profiles.length} anggota</p>
      <div style={{ height: 90 }} />
    </div>
  );
}

root.render(<App />);
